name: Update Mario contribution game

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/art.py"
      - "scripts/generate_mario.py"
      - ".github/workflows/mario.yml"

permissions:
  contents: write

concurrency:
  group: mario-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate contribution-based Mario SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_mario.py
      - name: Save the updated level
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mario-contributions.svg game/activity-level.js
          if ! git diff --cached --quiet; then
            git commit -m "Update Mario contribution run [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
