name: Generate synthwave contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate retro-neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300f6ff&color_dots=%2305010f,%2312052b,%235c1fb4,%23ff2bd6,%2300f6ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff2bd6&color_dots=%2305010f,%2312052b,%235c1fb4,%23ff2bd6,%2300f6ff

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
