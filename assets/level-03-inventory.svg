    <g transform="translate(804 126)"><rect width="242" height="104" fill="#0b0a16" stroke="#b48cff" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#7b4fa8"/><text x="43" y="52" text-anchor="middle" font-size="17" fill="#fff">UX</text><text x="84" y="48" font-size="18" fill="#fff7d6">PRODUCT</text><text x="84" y="74" font-size="12" fill="#d5bfff">DESIGN</text></g>
    <rect class="cursor" x="-8" y="-8" width="258" height="120" fill="none" stroke="#fff7d6" stroke-width="4" stroke-dasharray="12 8"/>
