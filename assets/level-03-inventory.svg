<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Level Three — Player Inventory</title>
  <desc id="desc">A pixel-game inventory showing Gurtejbir Singh's working technology stack.</desc>
  <style>
    .pixel { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; }
    .cursor { animation: choose 4s steps(1,end) infinite; }
    @keyframes choose { 0%,24%{transform:translate(0,0)} 25%,49%{transform:translate(268px,0)} 50%,74%{transform:translate(536px,0)} 75%,100%{transform:translate(804px,0)} }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="1200" height="440" fill="#17142a"/><rect x="18" y="18" width="1164" height="404" fill="#211d3b" stroke="#b48cff" stroke-width="6"/>
  <g class="pixel"><text x="52" y="66" font-size="18" fill="#b48cff" letter-spacing="3">WORLD 3-1</text><text x="52" y="100" font-size="30" fill="#fff7d6" letter-spacing="2">PLAYER INVENTORY</text><text x="1148" y="82" text-anchor="end" font-size="16" fill="#79c850">SLOTS: 12 / 12</text></g>
  <g transform="translate(54 132)" class="pixel">
    <g><rect width="242" height="104" fill="#0b0a16" stroke="#5c94fc" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#1769aa"/><text x="43" y="52" text-anchor="middle" font-size="20" fill="#fff">R</text><text x="84" y="48" font-size="18" fill="#fff7d6">REACT</text><text x="84" y="74" font-size="12" fill="#9ed2ff">INTERFACE</text></g>
    <g transform="translate(268)"><rect width="242" height="104" fill="#0b0a16" stroke="#fff7d6" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#f4f1e9"/><text x="43" y="52" text-anchor="middle" font-size="18" fill="#111">N</text><text x="84" y="48" font-size="18" fill="#fff7d6">NEXT.JS</text><text x="84" y="74" font-size="12" fill="#c8c3dc">SYSTEMS</text></g>
    <g transform="translate(536)"><rect width="242" height="104" fill="#0b0a16" stroke="#ffd166" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#ffd166"/><text x="43" y="52" text-anchor="middle" font-size="17" fill="#1a1528">Py</text><text x="84" y="48" font-size="18" fill="#fff7d6">PYTHON</text><text x="84" y="74" font-size="12" fill="#ffd166">AUTOMATION</text></g>
    <g transform="translate(804)"><rect width="242" height="104" fill="#0b0a16" stroke="#79c850" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#2b8a3e"/><text x="43" y="52" text-anchor="middle" font-size="16" fill="#fff">API</text><text x="84" y="48" font-size="18" fill="#fff7d6">FASTAPI</text><text x="84" y="74" font-size="12" fill="#79c850">BACKEND</text></g>
    <g transform="translate(0 126)"><rect width="242" height="104" fill="#0b0a16" stroke="#ff6b6b" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#e24a34"/><text x="43" y="52" text-anchor="middle" font-size="17" fill="#fff">Dj</text><text x="84" y="48" font-size="18" fill="#fff7d6">DJANGO</text><text x="84" y="74" font-size="12" fill="#ff8f8f">WEB APPS</text></g>
    <g transform="translate(268 126)"><rect width="242" height="104" fill="#0b0a16" stroke="#62c3ff" stroke-width="4"/><rect x="18" y="18" width="50" height="50" fill="#336791"/><text x="43" y="52" text-anchor="middle" font-size="15" fill="#fff">SQL</text><text x="84" y="48" font-size="18" fill="#fff7d6">POSTGRES</text><text x="84" y="74" font-size="12" fill="#9ed2ff">DATA</text></g>
