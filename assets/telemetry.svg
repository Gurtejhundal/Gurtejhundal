<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">Live telemetry</title><desc id="d">Starfire narrates the transition into the live GitHub activity graph from the upper right edge.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05000d"/><stop offset=".5" stop-color="#120229"/><stop offset="1" stop-color="#26053c"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".16"/></pattern></defs><rect width="1200" height="310" fill="url(#bg)"/><path d="M28 22H1172V288H28Z" fill="#060311" stroke="#321c55" stroke-width="2"/><g font-family="ui-monospace, Menlo, Consolas, monospace"><text x="68" y="70" fill="#ff2bd6" font-size="13" letter-spacing="3">04 // LIVE TELEMETRY</text><text x="68" y="118" fill="#fff" font-size="26" font-weight="700">THE PROFILE SHOULD MOVE BECAUSE THE WORK MOVES.</text><text x="68" y="160" fill="#bcb0d5" font-size="14">Commits, experiments and long-running practice leave a visible signal.</text><text x="68" y="214" fill="#00f6ff" font-size="14" letter-spacing="2">PUBLIC GITHUB ACTIVITY FEED ↓</text></g><g transform="translate(1000 20) scale(0.85)"><path d="M58 70 Q77 25 112 39 L131 84 114 116 78 116 57 93Z" fill="#df8b54" stroke="#4f2214" stroke-width="4"/><path d="M54 67 Q67 16 113 14 L139 58 122 52 112 24 92 46 65 39Z" fill="#e43072"/><circle cx="82" cy="76" r="7" fill="#6cff54"/><circle cx="108" cy="76" r="7" fill="#6cff54"/><path d="M69 114 L119 114 136 191 54 191Z" fill="#9b2c8f" stroke="#29102b" stroke-width="5"/><path d="M72 131 L117 131 124 177 66 177Z" fill="#5b268c"/><path d="M58 142 L23 177M125 142 L160 168" stroke="#df8b54" stroke-width="14" stroke-linecap="round"/><path d="M73 191 L62 246M111 191 L124 244" stroke="#9b2c8f" stroke-width="16" stroke-linecap="round"/><circle cx="31" cy="178" r="18" fill="#73ff64" opacity=".28" filter="url(#glow)"/></g><path d="M790 185H1060L1090 218 1060 251H790L760 218Z" fill="#0a0619" stroke="#73ff64" stroke-width="2"/><text x="925" y="211" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fff">“Keep going.</text><text x="925" y="232" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#73ff64">The signal is still getting brighter.”</text><rect width="1200" height="310" fill="url(#scan)" opacity=".3"/></svg>