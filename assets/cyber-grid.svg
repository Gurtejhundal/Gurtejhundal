    <rect x="16" y="16" width="1168" height="648" fill="url(#scan)" opacity=".38"/><rect x="16" y="34" width="1168" height="3" fill="#fff" opacity=".42" filter="url(#glow)"><animate attributeName="y" values="34;658;34" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.48;.08;0" dur="6.2s" repeatCount="indefinite"/></rect>
