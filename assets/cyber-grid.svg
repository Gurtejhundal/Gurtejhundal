    <stop offset="0" stop-color="#05000d"/><stop offset=".5" stop-color="#120229"/><stop offset="1" stop-color="#26053c"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
