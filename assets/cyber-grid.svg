    <circle cx="600" cy="340" r="207" fill="#ff2bd6" opacity=".17" filter="url(#softGlow)"><animate attributeName="opacity" values=".1;.27;.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="340" r="165" fill="url(#sun)" filter="url(#glow)"/>
    <g clip-path="url(#sunClip)" fill="#86116e"><rect x="420" y="337" width="360" height="7"/><rect x="420" y="359" width="360" height="9"/><rect x="420" y="385" width="360" height="12"/><rect x="420" y="416" width="360" height="15"/><rect x="420" y="453" width="360" height="19"/></g>

