<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Gurtejbir Singh — endless retro cyberpunk night drive</title>
  <desc id="desc">Animated synthwave hero with a retro sports car endlessly chasing a neon sunset down a moving perspective highway.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010006"/>
      <stop offset=".44" stop-color="#08021d"/>
      <stop offset=".72" stop-color="#190538"/>
      <stop offset="1" stop-color="#070112"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe56b"/>
      <stop offset=".43" stop-color="#ff7a71"/>
      <stop offset=".76" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#a51cff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17062f"/>
      <stop offset=".35" stop-color="#090217"/>
      <stop offset="1" stop-color="#010005"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30114f"/>
      <stop offset=".35" stop-color="#09030f"/>
      <stop offset=".75" stop-color="#160425"/>
      <stop offset="1" stop-color="#020107"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".48" stop-color="#d9f9ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".5" stop-color="#f4f4ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="tailGlow">
      <stop offset="0" stop-color="#ffec7a" stop-opacity="1"/>
      <stop offset=".32" stop-color="#ff4d8d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="roadBlur" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="screen"><rect x="22" y="22" width="1156" height="576" rx="26"/></clipPath>
    <clipPath id="sunClip"><circle cx="600" cy="224" r="104"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".2"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="30" fill="#010006"/>
  <rect x="11" y="11" width="1178" height="598" rx="28" fill="none" stroke="#27104d" stroke-width="2"/>

  <g clip-path="url(#screen)">
    <rect x="22" y="22" width="1156" height="576" fill="url(#sky)"/>

    <g fill="#d9f7ff">
      <circle cx="88" cy="88" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="156" cy="138" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="69" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="337" cy="123" r=".9"><animate attributeName="opacity" values=".9;.15;.9" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="78" r="1.1"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="768" cy="91" r="1.2"><animate attributeName="opacity" values=".15;.9;.15" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="865" cy="66" r=".9"><animate attributeName="opacity" values=".9;.2;.9" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="962" cy="126" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1102" cy="82" r="1.3"><animate attributeName="opacity" values=".2;.95;.2" dur="4.6s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Arial Black, Impact, sans-serif" text-anchor="middle">
      <text x="596" y="112" font-size="72" letter-spacing="10" fill="#00f6ff" opacity=".5">GURTEJBIR</text>
      <text x="604" y="112" font-size="72" letter-spacing="10" fill="#ff2bd6" opacity=".52">GURTEJBIR</text>
      <text x="600" y="112" font-size="72" letter-spacing="10" fill="url(#nameGlow)" filter="url(#glow)">GURTEJBIR
        <animate attributeName="x" values="600;600;592;608;600;600" keyTimes="0;.72;.745;.77;.80;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">
      <text x="48" y="53" fill="#00f6ff">CHANNEL 87.7 // NIGHT DRIVE</text>
      <text x="1152" y="53" text-anchor="end" fill="#ff79e6">RETRO FUTURE // LOOP ∞</text>
    </g>

    <circle cx="600" cy="224" r="125" fill="#ff2bd6" opacity=".13" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".10;.26;.10" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="120;132;120" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="224" r="104" fill="url(#sun)" filter="url(#glow)"/>
    <g clip-path="url(#sunClip)" fill="#170527">
      <rect x="488" y="238" width="224" height="6"/>
      <rect x="488" y="255" width="224" height="9"/>
      <rect x="488" y="276" width="224" height="12"/>
      <rect x="488" y="301" width="224" height="15"/>
    </g>

    <path d="M0 340 L70 340 70 312 96 312 96 331 125 331 125 294 151 294 151 340 206 340 206 320 228 320 228 301 250 301 250 340 314 340 314 282 342 282 342 340 389 340 389 309 413 309 413 340 468 340 468 300 490 300 490 269 516 269 516 340 684 340 684 302 709 302 709 340 760 340 760 274 789 274 789 340 846 340 846 305 872 305 872 324 902 324 902 340 952 340 952 286 978 286 978 340 1030 340 1030 311 1054 311 1054 340 1110 340 1110 298 1137 298 1137 340 1200 340 1200 365 0 365Z" fill="#020008" stroke="#5a2085" stroke-width="1"/>
    <g fill="#00f6ff" opacity=".45">
      <rect x="82" y="320" width="4" height="8"/><rect x="136" y="306" width="4" height="9"/>
      <rect x="328" y="293" width="5" height="10"/><rect x="478" y="315" width="4" height="8"/>
      <rect x="697" y="314" width="4" height="8"/><rect x="774" y="288" width="5" height="11"/>
      <rect x="964" y="300" width="4" height="9"/><rect x="1121" y="312" width="5" height="10"/>
    </g>

    <path d="M472 340 L728 340 L1120 620 L80 620 Z" fill="url(#road)"/>
    <path d="M472 340 L80 620" stroke="#ff2bd6" stroke-width="4" opacity=".95" filter="url(#glow)"/>
    <path d="M728 340 L1120 620" stroke="#00f6ff" stroke-width="4" opacity=".95" filter="url(#glow)"/>
    <path d="M510 340 L350 620" stroke="#722fff" stroke-width="1.8" opacity=".6"/>
    <path d="M690 340 L850 620" stroke="#722fff" stroke-width="1.8" opacity=".6"/>
    <path d="M600 340 L600 620" stroke="#f5eaff" stroke-width="2" stroke-dasharray="10 24" opacity=".55">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur=".85s" repeatCount="indefinite"/>
    </path>

    <g fill="none" stroke="#6f31b8" opacity=".72" filter="url(#roadBlur)">
      <path d="M454 360 H746"><animateTransform attributeName="transform" type="translate" values="0 0;0 88" dur="1.15s" repeatCount="indefinite"/></path>
      <path d="M426 392 H774"><animateTransform attributeName="transform" type="translate" values="0 0;0 110" dur="1.15s" repeatCount="indefinite"/></path>
      <path d="M388 433 H812"><animateTransform attributeName="transform" type="translate" values="0 0;0 138" dur="1.15s" repeatCount="indefinite"/></path>
      <path d="M338 487 H862"><animateTransform attributeName="transform" type="translate" values="0 0;0 166" dur="1.15s" repeatCount="indefinite"/></path>
    </g>

    <g stroke-linecap="round" opacity=".72">
      <path d="M190 386 l-90 118" stroke="#ff2bd6" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 -110;0 180" dur=".9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur=".9s" repeatCount="indefinite"/>
      </path>
      <path d="M1010 372 l96 125" stroke="#00f6ff" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 -130;0 190" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="1.05s" repeatCount="indefinite"/>
      </path>
      <path d="M272 448 l-72 110" stroke="#7f3cff" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="0 -150;0 150" dur=".72s" repeatCount="indefinite"/>
      </path>
      <path d="M920 444 l72 110" stroke="#ff2bd6" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="0 -120;0 160" dur=".78s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
      <text x="600" y="331" fill="#fff1ff" font-size="14" letter-spacing="6">CHASE THE SUN // BUILD UNTIL DAWN</text>
      <text x="600" y="357" fill="#00f6ff" font-size="10" letter-spacing="4">DISTANCE: ∞ // STATUS: ACCELERATING</text>
    </g>

    <ellipse cx="600" cy="566" rx="175" ry="28" fill="#ff2bd6" opacity=".16" filter="url(#softGlow)">
      <animate attributeName="rx" values="165;182;165" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".10;.23;.10" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>

    <g id="car">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -2;3 -5;0 0" keyTimes="0;.32;.68;1" dur="2.8s" repeatCount="indefinite"/>
      <path d="M430 523 Q452 470 501 450 Q532 435 600 435 Q668 435 699 450 Q748 470 770 523 L758 559 Q725 573 676 579 L524 579 Q475 573 442 559 Z" fill="url(#carBody)" stroke="url(#chrome)" stroke-width="2.2"/>
      <path d="M489 467 Q520 438 600 438 Q680 438 711 467 L686 486 H514 Z" fill="#05010b" stroke="#7f3cff" stroke-width="2"/>
      <path d="M516 468 Q548 449 600 449 Q652 449 684 468 L663 480 H537 Z" fill="#110426" stroke="#00f6ff" stroke-opacity=".42"/>
      <path d="M464 475 H736 L726 487 H474 Z" fill="#05010b" stroke="#ff2bd6" stroke-width="2"/>
      <rect x="488" y="485" width="12" height="24" fill="#090214"/>
      <rect x="700" y="485" width="12" height="24" fill="#090214"/>
      <rect x="469" y="511" width="262" height="18" rx="9" fill="#1b0419" stroke="#ff2bd6" stroke-width="1.5"/>
      <rect x="481" y="515" width="96" height="10" rx="5" fill="#ff315f" filter="url(#glow)">
        <animate attributeName="opacity" values=".72;1;.72" dur=".72s" repeatCount="indefinite"/>
      </rect>
      <rect x="623" y="515" width="96" height="10" rx="5" fill="#ff315f" filter="url(#glow)">
        <animate attributeName="opacity" values=".72;1;.72" dur=".72s" repeatCount="indefinite"/>
      </rect>
      <rect x="585" y="515" width="30" height="10" rx="4" fill="#00f6ff" opacity=".72"/>
      <path d="M460 543 Q510 559 600 559 Q690 559 740 543 L728 563 Q677 580 600 580 Q523 580 472 563 Z" fill="#030108" stroke="#6d2fc1" stroke-width="1.4"/>
      <path d="M524 560 H676" stroke="#00f6ff" stroke-width="2" opacity=".7"/>
      <rect x="563" y="539" width="74" height="17" rx="3" fill="#040109" stroke="#ff2bd6"/>
      <text x="600" y="551" text-anchor="middle" fill="#00f6ff" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">NIGHT87</text>
      <path d="M438 527 Q429 548 442 568 H470 L476 528 Z" fill="#010004"/>
      <path d="M762 527 Q771 548 758 568 H730 L724 528 Z" fill="#010004"/>
      <path d="M445 547 H466" stroke="#6930a7" stroke-width="3">
        <animate attributeName="stroke-dasharray" values="3 6;8 2;3 6" dur=".35s" repeatCount="indefinite"/>
      </path>
      <path d="M734 547 H755" stroke="#6930a7" stroke-width="3">
        <animate attributeName="stroke-dasharray" values="3 6;8 2;3 6" dur=".35s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="494" cy="563" rx="16" ry="8" fill="#020005" stroke="#9255c8"/>
      <ellipse cx="706" cy="563" rx="16" ry="8" fill="#020005" stroke="#9255c8"/>
      <ellipse cx="494" cy="569" rx="22" ry="34" fill="url(#tailGlow)" opacity=".45">
        <animate attributeName="ry" values="18;36;22;42;18" dur=".52s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".15;.55;.22;.62;.15" dur=".52s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="706" cy="569" rx="22" ry="34" fill="url(#tailGlow)" opacity=".45">
        <animate attributeName="ry" values="22;40;18;36;22" dur=".49s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.62;.15;.55;.2" dur=".49s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M465 500 Q520 471 574 468" fill="none" stroke="#00f6ff" stroke-width="2" opacity=".55"/>
      <path d="M735 500 Q680 471 626 468" fill="none" stroke="#ff2bd6" stroke-width="2" opacity=".55"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">
      <text x="48" y="584" fill="#bfa8ff">AI / FULL-STACK / PRODUCT / MOTION</text>
      <text x="1152" y="584" text-anchor="end" fill="#00f6ff">SUNLOCK: ACTIVE ●</text>
    </g>

    <rect x="22" y="22" width="1156" height="576" fill="url(#scanlines)" opacity=".5"/>
    <rect x="22" y="30" width="1156" height="3" fill="#eaffff" opacity=".5" filter="url(#glow)">
      <animate attributeName="y" values="30;594;30" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;.08;0" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <rect x="80" y="101" width="1030" height="6" fill="#00f6ff"/>
      <rect x="188" y="515" width="820" height="5" fill="#ff2bd6"/>
      <animate attributeName="opacity" values="0;0;.48;0;0" keyTimes="0;.74;.755;.77;1" dur="5.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;19 -4;-16 3;0 0" keyTimes="0;.74;.755;.77;1" dur="5.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>