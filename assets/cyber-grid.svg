<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Gurtejbir Singh — Night Begins to Shine</title>
  <desc id="desc">Animated retro title card with chrome synthwave Gurtejbir Singh lettering, Night Begins to Shine subtitle, a five-character cartoon lineup, a striped neon sunset, a rear-view wedge supercar, and a moving perspective grid.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080018"/><stop offset=".45" stop-color="#2d0059"/><stop offset=".72" stop-color="#8c089d"/><stop offset="1" stop-color="#15001d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff36c"/><stop offset=".34" stop-color="#ffc263"/><stop offset=".7" stop-color="#ff4b93"/><stop offset="1" stop-color="#ff20ce"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".14" stop-color="#a9f6ff"/><stop offset=".38" stop-color="#31cbff"/><stop offset=".54" stop-color="#ffe76b"/><stop offset=".72" stop-color="#ff6b9b"/><stop offset="1" stop-color="#a42cd5"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66efff"/><stop offset=".48" stop-color="#ffffff"/><stop offset=".72" stop-color="#ff77db"/><stop offset="1" stop-color="#b843ff"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f34cd8"/><stop offset=".28" stop-color="#a12cc4"/><stop offset=".62" stop-color="#51187c"/><stop offset="1" stop-color="#10031c"/>
    </linearGradient>
    <linearGradient id="carTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff63e8"/><stop offset=".48" stop-color="#a329c6"/><stop offset="1" stop-color="#35104b"/>
    </linearGradient>
    <radialGradient id="tailGlow"><stop offset="0" stop-color="#fff5c6"/><stop offset=".28" stop-color="#ff385f" stop-opacity=".95"/><stop offset="1" stop-color="#ff174f" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="logoShadow" x="-30%" y="-30%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/><feOffset dx="13" dy="16" result="off"/><feFlood flood-color="#26003e" flood-opacity=".95" result="f"/><feComposite in="f" in2="off" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="16" y="16" width="1168" height="648" rx="27"/></clipPath>
    <clipPath id="sunClip"><circle cx="600" cy="340" r="165"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".16"/></pattern>
  </defs>

  <rect width="1200" height="680" rx="30" fill="#050008"/>
