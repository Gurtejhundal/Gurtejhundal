<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Gurtejbir Singh retro cyberpunk profile banner</title>
  <desc id="desc">Animated synthwave night scene with neon sun, city skyline, perspective grid, VHS scanline and glitch typography.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02010b"/>
      <stop offset=".54" stop-color="#090425"/>
      <stop offset="1" stop-color="#14022d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".46" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10072a"/>
      <stop offset="1" stop-color="#02010b"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".52" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deepGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="24" y="24" width="1152" height="472" rx="24"/></clipPath>
    <clipPath id="sunClip"><circle cx="600" cy="158" r="92"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#010008"/>
  <rect x="14" y="14" width="1172" height="492" rx="26" fill="none" stroke="#25104d" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="1152" height="472" fill="url(#sky)"/>

    <g fill="#d8ecff">
      <circle cx="92" cy="84" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="174" cy="118" r="1"><animate attributeName="opacity" values="1;.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="278" cy="72" r="1.2"><animate attributeName="opacity" values=".15;.9;.15" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="402" cy="112" r=".9"><animate attributeName="opacity" values=".9;.2;.9" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="802" cy="78" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="944" cy="126" r="1"><animate attributeName="opacity" values=".8;.1;.8" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1092" cy="94" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="4.4s" repeatCount="indefinite"/></circle>
    </g>

    <circle cx="600" cy="158" r="106" fill="#ff2bd6" opacity=".16" filter="url(#deepGlow)">
      <animate attributeName="opacity" values=".12;.26;.12" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="158" r="92" fill="url(#sun)" filter="url(#glow)"/>
    <g clip-path="url(#sunClip)" fill="#120522">
      <rect x="500" y="176" width="200" height="6"/>
      <rect x="500" y="191" width="200" height="9"/>
      <rect x="500" y="210" width="200" height="12"/>
      <rect x="500" y="232" width="200" height="16"/>
    </g>

    <path d="M0 287 L90 287 90 252 112 252 112 277 140 277 140 236 165 236 165 287 210 287 210 260 230 260 230 245 252 245 252 287 320 287 320 226 348 226 348 287 380 287 380 250 405 250 405 287 470 287 470 242 493 242 493 215 516 215 516 287 690 287 690 238 718 238 718 287 760 287 760 218 786 218 786 287 850 287 850 245 874 245 874 270 898 270 898 287 948 287 948 228 974 228 974 287 1020 287 1020 252 1044 252 1044 287 1100 287 1100 234 1126 234 1126 287 1200 287 1200 320 0 320Z" fill="#03010c" stroke="#532a87" stroke-width="1"/>
    <g fill="#00f6ff" opacity=".55">
      <rect x="101" y="261" width="4" height="8"/><rect x="148" y="246" width="4" height="8"/>
      <rect x="330" y="236" width="5" height="10"/><rect x="482" y="252" width="4" height="9"/>
      <rect x="704" y="248" width="4" height="9"/><rect x="770" y="232" width="5" height="10"/>
      <rect x="962" y="240" width="4" height="9"/><rect x="1111" y="246" width="5" height="10"/>
    </g>

    <rect x="0" y="286" width="1200" height="234" fill="url(#road)"/>
    <line x1="600" y1="287" x2="-120" y2="520" stroke="#ff2bd6" stroke-width="2" opacity=".72"/>
    <line x1="600" y1="287" x2="180" y2="520" stroke="#7f3cff" stroke-width="1.6" opacity=".72"/>
    <line x1="600" y1="287" x2="390" y2="520" stroke="#00f6ff" stroke-width="1.4" opacity=".62"/>
    <line x1="600" y1="287" x2="810" y2="520" stroke="#00f6ff" stroke-width="1.4" opacity=".62"/>
    <line x1="600" y1="287" x2="1020" y2="520" stroke="#7f3cff" stroke-width="1.6" opacity=".72"/>
    <line x1="600" y1="287" x2="1320" y2="520" stroke="#ff2bd6" stroke-width="2" opacity=".72"/>

    <g fill="none" stroke="#7d49c9" opacity=".72">
      <path d="M0 318 H1200"/><path d="M0 342 H1200"/><path d="M0 371 H1200"/>
      <path d="M0 406 H1200"/><path d="M0 451 H1200"/>
    </g>
    <path d="M0 287 H1200" stroke="#00f6ff" stroke-width="3" filter="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <g font-family="Arial Black, Impact, sans-serif" text-anchor="middle">
      <text x="596" y="118" font-size="74" letter-spacing="10" fill="#00f6ff" opacity=".62">GURTEJBIR</text>
      <text x="604" y="118" font-size="74" letter-spacing="10" fill="#ff2bd6" opacity=".62">GURTEJBIR</text>
      <text x="600" y="118" font-size="74" letter-spacing="10" fill="url(#nameGlow)" filter="url(#glow)">GURTEJBIR
        <animate attributeName="x" values="600;600;593;607;600;600" keyTimes="0;.68;.71;.74;.78;1" dur="4.6s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="7" fill="#f6ddff">NIGHT BEGINS TO SHINE // BUILD MODE: ON</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">
      <text x="48" y="54" fill="#00f6ff">CHANNEL 87.7 // GURTEJ.NODE</text>
      <text x="1152" y="54" text-anchor="end" fill="#ff72df">RETRO FUTURE // 2026</text>
      <text x="48" y="480" fill="#b9a8ff">AI / FULL-STACK / PRODUCT / MOTION</text>
      <text x="1152" y="480" text-anchor="end" fill="#00f6ff">SIGNAL LOCKED ●</text>
    </g>

    <rect x="24" y="24" width="1152" height="472" fill="url(#scanlines)" opacity=".55"/>
    <rect x="24" y="40" width="1152" height="3" fill="#e8ffff" opacity=".55" filter="url(#glow)">
      <animate attributeName="y" values="40;488;40" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;.08;0" dur="6.2s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <rect x="80" y="92" width="1040" height="8" fill="#00f6ff"/>
      <rect x="210" y="132" width="760" height="5" fill="#ff2bd6"/>
      <animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;.72;.735;.75;1" dur="5.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;22 -5;-18 4;0 0" keyTimes="0;.72;.735;.75;1" dur="5.1s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>