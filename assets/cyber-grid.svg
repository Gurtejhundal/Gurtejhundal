<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Gurtejbir Singh — Night Begins to Shine</title>
<desc id="desc">Retro cyberpunk profile hero with a realistic neon-outline muscle car, striped synthwave sun, and a proportionally realistic cyberpunk human figure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05000d"/><stop offset=".55" stop-color="#120229"/><stop offset="1" stop-color="#25043c"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff172"/><stop offset=".4" stop-color="#ffad5d"/><stop offset=".75" stop-color="#ff4f91"/><stop offset="1" stop-color="#ff20ce"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120619"/><stop offset=".3" stop-color="#44105d"/><stop offset=".55" stop-color="#16051f"/><stop offset=".8" stop-color="#57106b"/><stop offset="1" stop-color="#09030f"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03060d"/><stop offset=".55" stop-color="#14142d"/><stop offset="1" stop-color="#020208"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f6ff"/><stop offset=".45" stop-color="#9250ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <radialGradient id="tire" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#20212b"/><stop offset=".55" stop-color="#090a10"/><stop offset="1" stop-color="#000"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".14"/></pattern>
  <clipPath id="sunClip"><circle cx="500" cy="180" r="164"/></clipPath>
</defs>

<rect width="1200" height="500" fill="url(#bg)"/>
<g fill="#fff" opacity=".55"><circle cx="62" cy="74" r="1"/><circle cx="184" cy="43" r="1.2"/><circle cx="986" cy="37" r="1"/><circle cx="1118" cy="118" r="1.1"/><circle cx="1055" cy="64" r=".8"/></g>

<!-- synthwave sun -->
<circle cx="500" cy="180" r="188" fill="#ff2bd6" opacity=".16" filter="url(#soft)"/>
<circle cx="500" cy="180" r="164" fill="url(#sun)" filter="url(#glow)"/>
<g clip-path="url(#sunClip)" fill="#7f0f6b"><rect x="326" y="173" width="350" height="7"/><rect x="326" y="197" width="350" height="10"/><rect x="326" y="226" width="350" height="13"/><rect x="326" y="260" width="350" height="17"/><rect x="326" y="301" width="350" height="22"/></g>

<!-- horizon and grid -->
<path d="M0 315H1200V500H0Z" fill="#06000d"/>
<path d="M0 315H1200" stroke="#00f6ff" stroke-width="1.2" opacity=".42"/>
<g stroke="#ff2bd6" stroke-width="1" opacity=".55">
  <path d="M500 315L20 500M500 315L160 500M500 315L300 500M500 315L405 500M500 315L470 500M500 315L535 500M500 315L620 500M500 315L760 500M500 315L930 500M500 315L1190 500"/>
</g>
<g stroke="#00f6ff" stroke-width="1" opacity=".22"><path d="M0 340H1200"/><path d="M0 374H1200"/><path d="M0 418H1200"/><path d="M0 470H1200"/></g>

<!-- realistic neon-outline muscle car -->
<g id="car">
  <ellipse cx="485" cy="438" rx="355" ry="42" fill="#000" opacity=".7"/>
  <ellipse cx="490" cy="425" rx="305" ry="26" fill="#ff2bd6" opacity=".11" filter="url(#soft)"/>

  <!-- rear wheel -->
  <g transform="translate(352 390) rotate(-4)">
    <ellipse rx="62" ry="71" fill="url(#tire)" stroke="#0c0611" stroke-width="10"/>
    <ellipse rx="43" ry="52" fill="#11121a" stroke="#b9c4d6" stroke-width="5"/>
    <ellipse rx="29" ry="36" fill="#05060b" stroke="url(#rim)" stroke-width="3" opacity=".95"/>
    <circle r="9" fill="#1b1d26" stroke="#d7d8e2" stroke-width="2"/>
    <g stroke="#8990a6" stroke-width="2" opacity=".75"><path d="M0-32V32"/><path d="M-23-23L23 23"/><path d="M23-23L-23 23"/><path d="M-30 0H30"/></g>
  </g>

  <!-- front wheel -->
  <g transform="translate(790 365) rotate(-3)">
    <ellipse rx="48" ry="61" fill="url(#tire)" stroke="#0c0611" stroke-width="9"/>
    <ellipse rx="34" ry="45" fill="#11121a" stroke="#b9c4d6" stroke-width="4"/>
    <ellipse rx="22" ry="31" fill="#05060b" stroke="url(#rim)" stroke-width="2.5"/>
    <circle r="7" fill="#1b1d26" stroke="#d7d8e2" stroke-width="2"/>
    <g stroke="#8990a6" stroke-width="1.8" opacity=".75"><path d="M0-28V28"/><path d="M-20-20L20 20"/><path d="M20-20L-20 20"/><path d="M-26 0H26"/></g>
  </g>

  <!-- body mass with realistic proportions -->
  <path d="M104 360 C121 328 159 302 219 288 L385 249 C434 237 492 232 558 235 L681 242 C716 245 752 259 779 279 L831 317 C858 326 879 340 894 360 L879 393 C853 406 823 411 786 410 L725 405 C687 418 646 430 599 436 L442 455 C387 462 326 458 267 450 L163 436 C136 431 117 421 104 405Z" fill="url(#body)" stroke="#ff35d0" stroke-width="2.8"/>

  <!-- roof, windshield, side glass -->
  <path d="M332 277 C392 228 456 205 544 207 C604 208 651 217 696 238 L750 280 L610 268 L486 267Z" fill="#12051b" stroke="#bc55ff" stroke-width="2.5"/>
  <path d="M373 267 C420 229 468 215 526 216 L550 217 L568 260 L483 258Z" fill="url(#glass)" stroke="#e6dcff" stroke-width="2"/>
  <path d="M568 218 C610 220 640 226 675 241 L719 272 L586 261Z" fill="url(#glass)" stroke="#9e51d8" stroke-width="2"/>
  <path d="M553 218L572 262" stroke="#21172c" stroke-width="7"/>

  <!-- body highlights and panel geometry -->
  <path d="M159 326 C325 298 504 285 699 290 C756 292 808 304 850 329" fill="none" stroke="#ff7be8" stroke-width="4" opacity=".8"/>
  <path d="M228 350 C404 323 597 313 776 320" fill="none" stroke="#7a39ff" stroke-width="3" opacity=".55"/>
  <path d="M600 291 L585 410" stroke="#32123e" stroke-width="2" opacity=".8"/>
  <path d="M708 304 L694 394" stroke="#32123e" stroke-width="2" opacity=".8"/>
  <path d="M607 308 C638 307 665 307 687 309" stroke="#d0b7e9" stroke-width="2" opacity=".75"/>
  <rect x="653" y="320" width="23" height="5" rx="2.5" fill="#b7a5c9" opacity=".8"/>
  <path d="M785 320 C817 322 850 333 873 349 L831 354 L796 342Z" fill="#16051d" stroke="#9137ca" stroke-width="1.6"/>

  <!-- rear fascia -->
  <path d="M105 360 L272 340 L291 416 L168 427 L111 407Z" fill="#08020c" stroke="#3a104c" stroke-width="2"/>
  <path d="M121 374 L274 357" stroke="#663173" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <rect x="131" y="366" width="63" height="19" rx="4" fill="#fa164d"/><rect x="207" y="358" width="62" height="19" rx="4" fill="#fa164d"/>
    <rect x="143" y="370" width="40" height="11" rx="2" fill="#ffd3d9"/><rect x="219" y="362" width="38" height="11" rx="2" fill="#ffd3d9"/>
  </g>
  <rect x="137" y="397" width="50" height="9" rx="3" fill="#08080b" stroke="#9c99a8" stroke-width="2"/>
  <path d="M168 427 L276 422 L258 445 L170 438Z" fill="#030105"/>

  <!-- bumper / exhaust -->
  <path d="M116 407 C145 425 204 432 270 422" fill="none" stroke="#6d5e79" stroke-width="3" opacity=".65"/>
  <rect x="270" y="423" width="42" height="12" rx="6" fill="#090a0e" stroke="#a8aab3" stroke-width="2.5"/>
  <path d="M289 435 L277 458 L301 445Z" fill="#ff8a55" opacity=".72" filter="url(#glow)"/>

  <!-- front contour -->
  <path d="M789 319 C839 324 873 338 894 360 L879 393 L827 400" fill="none" stroke="#ff42d5" stroke-width="2.3"/>
  <path d="M824 338 L865 349 L843 364 L809 351Z" fill="#09040e" stroke="#b340e4" stroke-width="1.8"/>
</g>

<!-- realistic human silhouette: no cartoon proportions -->
<g id="figure" transform="translate(1000 190)">
  <ellipse cx="77" cy="301" rx="65" ry="13" fill="#000" opacity=".5"/>
  <!-- head and neck -->
  <path d="M62 39 C62 20 74 8 89 8 C106 8 117 22 115 42 C113 56 106 66 94 69 L92 84 L71 84 L71 67 C64 61 61 51 62 39Z" fill="#07070c" stroke="#ff2bd6" stroke-width="1.5"/>
  <path d="M64 29 C69 15 79 8 91 8 C106 8 116 18 117 32 C108 26 103 21 98 15 C92 23 81 28 64 29Z" fill="#0b0910" stroke="#7d35aa" stroke-width="1.2"/>
  <!-- torso jacket -->
  <path d="M70 80 C50 85 36 99 32 119 L27 184 C28 201 36 211 49 214 L55 160 L57 224 L117 224 L119 160 L125 214 C139 211 146 200 146 183 L141 119 C137 99 123 85 102 80Z" fill="#090a10" stroke="url(#rim)" stroke-width="2.4"/>
  <path d="M72 88 L87 110 L103 88" fill="none" stroke="#383044" stroke-width="2"/>
  <path d="M57 123 C76 135 99 135 118 123" fill="none" stroke="#27202f" stroke-width="1.5"/>
  <path d="M86 110 V197" stroke="#24202c" stroke-width="1.5"/>
  <!-- arms and hands -->
  <path d="M34 119 C22 149 18 178 22 202 C24 216 31 227 40 232 L51 220 C45 208 44 198 46 182 L55 137Z" fill="#08090d" stroke="#00f6ff" stroke-width="1.6" opacity=".95"/>
  <path d="M139 119 C151 149 155 178 151 202 C149 216 142 227 133 232 L122 220 C128 208 129 198 127 182 L118 137Z" fill="#08090d" stroke="#ff2bd6" stroke-width="1.6" opacity=".95"/>
  <path d="M33 229 C27 238 28 245 37 249 C44 250 49 244 50 236 L43 229Z" fill="#07070b" stroke="#00f6ff" stroke-width="1.3"/>
  <path d="M140 229 C146 238 145 245 136 249 C129 250 124 244 123 236 L130 229Z" fill="#07070b" stroke="#ff2bd6" stroke-width="1.3"/>
  <!-- trousers -->
  <path d="M58 222 L83 222 L80 274 L76 316 L48 316 L52 273Z" fill="#08090d" stroke="#785097" stroke-width="1.5"/>
  <path d="M91 222 L116 222 L122 273 L126 316 L98 316 L94 274Z" fill="#08090d" stroke="#785097" stroke-width="1.5"/>
  <path d="M48 313 C54 307 66 306 77 312 L75 326 L42 326 C41 321 43 316 48 313Z" fill="#08090e" stroke="#00f6ff" stroke-width="1.5"/>
  <path d="M98 312 C109 306 121 307 127 313 C132 316 134 321 133 326 L100 326Z" fill="#08090e" stroke="#ff2bd6" stroke-width="1.5"/>
  <!-- subtle neon trim -->
  <path d="M70 82 C58 100 53 122 53 145" fill="none" stroke="#00f6ff" stroke-width="1.1" opacity=".55"/>
  <path d="M103 82 C116 100 120 122 120 145" fill="none" stroke="#ff2bd6" stroke-width="1.1" opacity=".55"/>
</g>

<!-- quote -->
<path d="M780 52H1050L1105 99L1050 146H780L742 99Z" fill="#080415" stroke="#ff2bd6" stroke-width="2"/>
<text x="925" y="88" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#fff">“Pick a direction.</text>
<text x="925" y="112" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#00f6ff">Then build fast enough to catch it.”</text>

<rect width="1200" height="500" fill="url(#scan)" opacity=".3" pointer-events="none"/>
</svg>