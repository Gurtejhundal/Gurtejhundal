  <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#bdf7ff"/><stop offset=".42" stop-color="#38c5ff"/><stop offset=".62" stop-color="#ffe66d"/><stop offset=".82" stop-color="#ff699e"/><stop offset="1" stop-color="#9a34df"/></linearGradient>
