<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Night Begins to Shine — endless outrun chase</title>
  <desc id="desc">Animated retro cyberpunk hero with a rear-view 1980s wedge supercar endlessly chasing a giant striped neon sunset over a moving perspective grid.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080019"/>
      <stop offset="0.48" stop-color="#25004f"/>
      <stop offset="0.78" stop-color="#6e048a"/>
      <stop offset="1" stop-color="#130019"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff16a"/>
      <stop offset="0.38" stop-color="#ff9f5f"/>
      <stop offset="0.72" stop-color="#ff3f8f"/>
      <stop offset="1" stop-color="#ff1fd0"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f177c"/>
      <stop offset="0.28" stop-color="#be2bb6"/>
      <stop offset="0.58" stop-color="#5f1683"/>
      <stop offset="1" stop-color="#150420"/>
    </linearGradient>
    <linearGradient id="carTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f34ee0"/>
      <stop offset="0.52" stop-color="#8622ad"/>
      <stop offset="1" stop-color="#33104d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140522"/>
      <stop offset="1" stop-color="#040109"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="tailGlow">
      <stop offset="0" stop-color="#fff6bf" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#ff4b7d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff166f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="18" y="18" width="1164" height="614" rx="26"/></clipPath>
    <clipPath id="sunClip"><circle cx="600" cy="235" r="170"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="650" rx="30" fill="#050009"/>
  <g clip-path="url(#screen)">
    <rect x="18" y="18" width="1164" height="614" fill="url(#sky)"/>

    <circle cx="600" cy="235" r="205" fill="#ff2bd6" opacity="0.18" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="235" r="170" fill="url(#sun)" filter="url(#glow)"/>
    <g clip-path="url(#sunClip)" fill="#6b0c72">
      <rect x="415" y="230" width="370" height="8"/>
      <rect x="415" y="251" width="370" height="10"/>
      <rect x="415" y="276" width="370" height="12"/>
      <rect x="415" y="305" width="370" height="15"/>
      <rect x="415" y="339" width="370" height="18"/>
      <rect x="415" y="378" width="370" height="22"/>
    </g>

    <path d="M0 385 H1200 V650 H0 Z" fill="#090014"/>

    <g stroke="#ff2bd6" opacity="0.7" fill="none">
      <path d="M600 385 L0 650"/><path d="M600 385 L130 650"/><path d="M600 385 L260 650"/><path d="M600 385 L390 650"/><path d="M600 385 L520 650"/>
      <path d="M600 385 L680 650"/><path d="M600 385 L810 650"/><path d="M600 385 L940 650"/><path d="M600 385 L1070 650"/><path d="M600 385 L1200 650"/>
    </g>
    <g stroke="#00f6ff" opacity="0.32" fill="none">
      <path d="M0 405 H1200"><animateTransform attributeName="transform" type="translate" values="0 0;0 70" dur="1.05s" repeatCount="indefinite"/></path>
      <path d="M0 438 H1200"><animateTransform attributeName="transform" type="translate" values="0 0;0 90" dur="1.05s" repeatCount="indefinite"/></path>
      <path d="M0 480 H1200"><animateTransform attributeName="transform" type="translate" values="0 0;0 112" dur="1.05s" repeatCount="indefinite"/></path>
      <path d="M0 535 H1200"><animateTransform attributeName="transform" type="translate" values="0 0;0 138" dur="1.05s" repeatCount="indefinite"/></path>
      <path d="M0 605 H1200"><animateTransform attributeName="transform" type="translate" values="0 0;0 166" dur="1.05s" repeatCount="indefinite"/></path>
    </g>

    <g id="car">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -2;4 -3;0 0" dur="2.8s" repeatCount="indefinite"/>

      <ellipse cx="600" cy="574" rx="245" ry="34" fill="#000" opacity="0.6"/>
      <ellipse cx="600" cy="568" rx="215" ry="24" fill="#ff2bd6" opacity="0.14" filter="url(#softGlow)"/>

      <ellipse cx="407" cy="542" rx="48" ry="74" fill="#050108"/>
      <ellipse cx="793" cy="542" rx="48" ry="74" fill="#050108"/>
      <ellipse cx="407" cy="542" rx="28" ry="58" fill="#1f1630" stroke="#d8d7ee" stroke-width="5"/>
      <ellipse cx="793" cy="542" rx="28" ry="58" fill="#1f1630" stroke="#d8d7ee" stroke-width="5"/>
      <ellipse cx="407" cy="542" rx="15" ry="39" fill="#0a0710"/>
      <ellipse cx="793" cy="542" rx="15" ry="39" fill="#0a0710"/>

      <path d="M375 520 Q395 472 457 448 L520 429 H680 L743 448 Q805 472 825 520 L804 570 Q755 589 691 596 H509 Q445 589 396 570 Z" fill="url(#car)" stroke="#ff70e7" stroke-width="3"/>
      <path d="M472 449 L521 409 H679 L728 449 L690 474 H510 Z" fill="url(#carTop)" stroke="#9f4bea" stroke-width="2"/>
      <path d="M510 431 L543 402 H657 L690 431 L657 452 H543 Z" fill="url(#glass)" stroke="#d861ff" stroke-width="2"/>

      <path d="M407 477 H793" stroke="#11031a" stroke-width="12"/>
      <path d="M374 448 H826" stroke="#050108" stroke-width="12" stroke-linecap="square"/>
      <path d="M403 440 H797" stroke="#8d27be" stroke-width="10" stroke-linecap="square"/>
      <path d="M432 439 L447 405 H466 L456 439" fill="#120319" stroke="#7d239f" stroke-width="2"/>
      <path d="M768 439 L753 405 H734 L744 439" fill="#120319" stroke="#7d239f" stroke-width="2"/>

      <path d="M401 516 H799 L782 560 Q745 573 693 579 H507 Q455 573 418 560 Z" fill="#11031a" stroke="#63226e" stroke-width="2"/>
      <path d="M455 527 H745 L728 557 H472 Z" fill="#050108" stroke="#2e0c3d" stroke-width="2"/>

      <rect x="430" y="512" width="62" height="20" rx="2" fill="#ff174f" filter="url(#glow)">
        <animate attributeName="opacity" values="0.78;1;0.78" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="500" y="512" width="48" height="20" rx="2" fill="#ff174f" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.8;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="652" y="512" width="48" height="20" rx="2" fill="#ff174f" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.8;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="708" y="512" width="62" height="20" rx="2" fill="#ff174f" filter="url(#glow)">
        <animate attributeName="opacity" values="0.78;1;0.78" dur="0.8s" repeatCount="indefinite"/>
      </rect>

      <ellipse cx="461" cy="522" rx="55" ry="30" fill="url(#tailGlow)" opacity="0.24"/>
      <ellipse cx="739" cy="522" rx="55" ry="30" fill="url(#tailGlow)" opacity="0.24"/>

      <path d="M461 562 H518 L500 580 H442 Z" fill="#050108"/>
      <path d="M682 562 H739 L758 580 H700 Z" fill="#050108"/>
      <rect x="540" y="565" width="38" height="12" rx="5" fill="#0b0710" stroke="#b6b5c3" stroke-width="3"/>
      <rect x="622" y="565" width="38" height="12" rx="5" fill="#0b0710" stroke="#b6b5c3" stroke-width="3"/>
      <path d="M552 578 l-13 20 21 -12 Z" fill="#ff8f53" opacity="0.75">
        <animate attributeName="opacity" values="0;0.9;0" dur="0.55s" repeatCount="indefinite"/>
      </path>
      <path d="M648 578 l13 20 -21 -12 Z" fill="#ff8f53" opacity="0.75">
        <animate attributeName="opacity" values="0.9;0;0.9" dur="0.55s" repeatCount="indefinite"/>
      </path>

      <path d="M423 486 Q476 456 542 448" stroke="#ff66ea" stroke-width="3" opacity="0.7"/>
      <path d="M777 486 Q724 456 658 448" stroke="#7d35ff" stroke-width="3" opacity="0.6"/>
    </g>

    <g stroke-linecap="round" opacity="0.65">
      <path d="M174 438 l-95 125" stroke="#ff2bd6" stroke-width="3"><animateTransform attributeName="transform" type="translate" values="0 -120;0 190" dur="0.92s" repeatCount="indefinite"/></path>
      <path d="M1030 430 l95 126" stroke="#00f6ff" stroke-width="3"><animateTransform attributeName="transform" type="translate" values="0 -140;0 190" dur="1.02s" repeatCount="indefinite"/></path>
    </g>

    <text x="600" y="92" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" letter-spacing="7" fill="url(#cta)" filter="url(#glow)">NIGHT BEGINS TO SHINE</text>

    <rect x="18" y="18" width="1164" height="614" fill="url(#scanlines)" opacity="0.42"/>
    <rect x="18" y="32" width="1164" height="3" fill="#ffffff" opacity="0.45" filter="url(#glow)">
      <animate attributeName="y" values="32;628;32" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.08;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>