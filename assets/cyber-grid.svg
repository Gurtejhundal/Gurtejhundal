<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Gurtejbir Singh — Night Begins to Shine</title>
<desc id="d">Retro cyberpunk profile hero with a synthwave car chasing a striped sun while Robin narrates from the edge.</desc>
<defs>
