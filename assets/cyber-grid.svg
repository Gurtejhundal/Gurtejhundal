<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Gurtejbir Singh cyberpunk profile banner</title>
  <desc id="desc">Animated neon HUD banner with grid, particles, glitch text, status panels, and scan line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020108"/>
      <stop offset="0.48" stop-color="#09031b"/>
      <stop offset="1" stop-color="#02030c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#8b5cf6;#ff2bd6;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ff2bd6;#00f0ff;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#00f0ff;#8b5cf6;#ff2bd6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00d9ff" stroke-opacity=".095" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#ff2bd6" fill-opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="44" y="35" width="1112" height="360" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="390" rx="24" fill="none" stroke="#7c3aed" stroke-opacity=".35"/>
  <rect x="34" y="30" width="1132" height="370" rx="20" fill="url(#grid)" opacity=".9">
    <animate attributeName="opacity" values=".55;.95;.65;.9" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#screen)">
    <path d="M-60 340 C220 265 410 425 650 318 S1010 245 1280 328" fill="none" stroke="#8b5cf6" stroke-opacity=".26" stroke-width="2">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-60 340 C220 265 410 425 650 318 S1010 245 1280 328;M-60 322 C230 405 420 250 655 350 S1010 405 1280 300;M-60 340 C220 265 410 425 650 318 S1010 245 1280 328"/>
    </path>
    <path d="M-60 360 C240 300 390 385 655 342 S1020 300 1280 355" fill="none" stroke="#00f0ff" stroke-opacity=".22" stroke-width="1.5">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M-60 360 C240 300 390 385 655 342 S1020 300 1280 355;M-60 350 C180 415 430 285 650 365 S1000 285 1280 340;M-60 360 C240 300 390 385 655 342 S1020 300 1280 355"/>
    </path>

    <g fill="#00f0ff" filter="url(#glow)">
      <circle cx="110" cy="330" r="2.5"><animate attributeName="cy" values="420;40;420" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="90" r="2"><animate attributeName="cy" values="420;20;420" dur="8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="250" r="2"><animate attributeName="cy" values="420;35;420" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="150" r="2.5"><animate attributeName="cy" values="420;55;420" dur="9s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="-1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ff2bd6" filter="url(#glow)">
      <circle cx="165" cy="190" r="2"><animate attributeName="cy" values="30;405;30" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="95" r="2.5"><animate attributeName="cy" values="30;405;30" dur="7s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="-3s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="35" y="48" width="1130" height="3" fill="#00f0ff" opacity=".55" filter="url(#glow)">
      <animate attributeName="y" values="35;395;35" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;.12;0" dur="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">
    <text x="72" y="73" fill="#00f0ff">SYS://GURTEJ.NODE</text>
    <circle cx="1114" cy="68" r="5" fill="#39ff14" filter="url(#glow)"><animate attributeName="opacity" values="1;.22;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="1138" y="73" text-anchor="end" fill="#a7ffb0">ONLINE</text>
    <text x="72" y="360" fill="#9d8cff">AI × FULL-STACK × PRODUCT</text>
    <text x="1128" y="360" text-anchor="end" fill="#ff6bdc">BUILD // BREAK // REFACTOR // SHIP</text>
  </g>

  <g transform="translate(72 112)">
    <rect width="1056" height="192" rx="14" fill="#05020f" fill-opacity=".72" stroke="url(#neon)" stroke-width="1.2"/>
    <path d="M0 28H140L160 8H440" fill="none" stroke="#00f0ff" stroke-opacity=".6"/>
    <path d="M1056 162H930L910 184H640" fill="none" stroke="#ff2bd6" stroke-opacity=".6"/>

    <text x="528" y="78" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="8" fill="url(#neon)" filter="url(#softGlow)">GURTEJBIR</text>
    <text x="528" y="78" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="8" fill="url(#neon)">GURTEJBIR
      <animate attributeName="x" values="528;528;521;535;528;528" keyTimes="0;.72;.75;.78;.81;1" dur="4.2s" repeatCount="indefinite"/>
    </text>
    <text x="528" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" letter-spacing="12" fill="#e7e5ff">S I N G H</text>
    <text x="528" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#00f0ff">ENGINEERING EXPERIENCES AT THE EDGE OF CODE + DESIGN + AI</text>

    <rect x="26" y="154" width="92" height="6" rx="3" fill="#16122e"/>
    <rect x="26" y="154" width="18" height="6" rx="3" fill="#00f0ff"><animate attributeName="width" values="18;92;42;78;18" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="938" y="30" width="92" height="6" rx="3" fill="#16122e"/>
    <rect x="938" y="30" width="18" height="6" rx="3" fill="#ff2bd6"><animate attributeName="width" values="70;25;92;48;70" dur="3.5s" repeatCount="indefinite"/></rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6f67a5">
    <text x="72" y="388">LATENCY 07ms</text>
    <text x="210" y="388">SIGNAL 99.97%</text>
    <text x="1010" y="388">v2026.08</text>
  </g>
</svg>