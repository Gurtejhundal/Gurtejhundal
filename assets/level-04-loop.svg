<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Level Four — Build Loop</title>
  <desc id="desc">A pixel railway of Gurtejbir Singh's five-step engineering workflow: inspect, build, test, refine, and ship.</desc>
  <style>
    .pixel { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; }
    .cart { animation: travel 8s steps(48,end) infinite; }
    @keyframes travel { from { transform: translateX(-90px); } to { transform: translateX(1260px); } }
    @media (prefers-reduced-motion: reduce) { .cart { animation: none; transform: translateX(20px); } }
  </style>
  <rect width="1200" height="330" fill="#102b46"/><rect x="18" y="18" width="1164" height="294" fill="#0d2238" stroke="#79c850" stroke-width="6"/>
  <g class="pixel"><text x="52" y="62" font-size="18" fill="#79c850" letter-spacing="3">WORLD 4-1</text><text x="52" y="96" font-size="30" fill="#fff7d6" letter-spacing="2">THE BUILD LOOP</text><text x="1148" y="78" text-anchor="end" font-size="15" fill="#9ed2ff">EVIDENCE &gt; ASSUMPTIONS</text></g>
  <path d="M78 220H1122" stroke="#67768a" stroke-width="12"/><path d="M78 226H1122" stroke="#1a2635" stroke-width="5" stroke-dasharray="18 14"/>
  <g class="pixel" text-anchor="middle">
    <g transform="translate(148 132)"><rect x="-72" width="144" height="64" fill="#17365d" stroke="#5c94fc" stroke-width="4"/><text y="27" font-size="13" fill="#9ed2ff">CHECKPOINT 01</text><text y="50" font-size="18" fill="#fff7d6">INSPECT</text><rect x="-8" y="64" width="16" height="26" fill="#5c94fc"/></g>
    <g transform="translate(374 132)"><rect x="-72" width="144" height="64" fill="#17365d" stroke="#ffd166" stroke-width="4"/><text y="27" font-size="13" fill="#ffd166">CHECKPOINT 02</text><text y="50" font-size="18" fill="#fff7d6">BUILD</text><rect x="-8" y="64" width="16" height="26" fill="#ffd166"/></g>
    <g transform="translate(600 132)"><rect x="-72" width="144" height="64" fill="#17365d" stroke="#ff6b6b" stroke-width="4"/><text y="27" font-size="13" fill="#ff8f8f">CHECKPOINT 03</text><text y="50" font-size="18" fill="#fff7d6">TEST</text><rect x="-8" y="64" width="16" height="26" fill="#ff6b6b"/></g>
    <g transform="translate(826 132)"><rect x="-72" width="144" height="64" fill="#17365d" stroke="#b48cff" stroke-width="4"/><text y="27" font-size="13" fill="#d5bfff">CHECKPOINT 04</text><text y="50" font-size="18" fill="#fff7d6">REFINE</text><rect x="-8" y="64" width="16" height="26" fill="#b48cff"/></g>
    <g transform="translate(1052 132)"><rect x="-72" width="144" height="64" fill="#17365d" stroke="#79c850" stroke-width="4"/><text y="27" font-size="13" fill="#79c850">CHECKPOINT 05</text><text y="50" font-size="18" fill="#fff7d6">SHIP</text><rect x="-8" y="64" width="16" height="26" fill="#79c850"/></g>
  </g>
  <g class="cart" transform="translate(-90 232)"><rect width="68" height="34" fill="#c84c0c"/><rect x="8" y="-15" width="48" height="20" fill="#fc9838"/><rect x="10" y="30" width="16" height="16" fill="#111018"/><rect x="44" y="30" width="16" height="16" fill="#111018"/><rect x="20" y="-11" width="28" height="12" fill="#ffd166"/></g>
  <text x="600" y="294" text-anchor="middle" class="pixel" font-size="14" fill="#b9d9f4">SOLVE THE WORKFLOW, NOT JUST THE SCREEN.</text>
</svg>
