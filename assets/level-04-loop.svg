<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" shape-rendering="crispEdges"><title id="title">World Four — The Build Loop</title><desc id="desc">A side-scrolling five-checkpoint engineering course: inspect, build, test, refine, and ship.</desc><style>.p{font-family:"Courier New",monospace;font-weight:900}.r{animation:run 8s steps(45,end) infinite}@keyframes run{from{transform:translateX(-90px)}to{transform:translateX(1230px)}}@media(prefers-reduced-motion:reduce){.r{animation:none;transform:translateX(38px)}}</style><rect width="1200" height="360" fill="#5c94fc"/><rect x="14" y="14" width="1172" height="332" fill="none" stroke="#101820" stroke-width="12"/><path d="M820 70h34V52h48v18h34v24H820zM1010 105h28V90h42v15h30v22h-100z" fill="#fff"/><g class="p"><text x="46" y="58" font-size="18" fill="#fff" letter-spacing="3">WORLD 4-1</text><text x="46" y="92" font-size="30" fill="#fff" stroke="#101820" stroke-width="2" paint-order="stroke">THE BUILD LOOP</text><text x="1150" y="64" text-anchor="end" font-size="15" fill="#fff">EVIDENCE &gt; ASSUMPTIONS</text></g><defs><g id="f"><path d="M0 0v112" stroke="#fff" stroke-width="7"/><path d="M4 4h108v45H4z" fill="currentColor" stroke="#101820" stroke-width="5"/></g></defs><g class="p" text-anchor="middle"><g transform="translate(128 134)" color="#5c94fc"><use href="#f"/><text x="58" y="23" font-size="11" fill="#fff">CHECKPOINT 01</text><text x="58" y="41" font-size="16" fill="#fff">INSPECT</text></g><g transform="translate(348 134)" color="#ffd166"><use href="#f"/><text x="58" y="23" font-size="11">CHECKPOINT 02</text><text x="58" y="41" font-size="16">BUILD</text></g><g transform="translate(568 134)" color="#e52521"><use href="#f"/><text x="58" y="23" font-size="11" fill="#fff">CHECKPOINT 03</text><text x="58" y="41" font-size="16" fill="#fff">TEST</text></g><g transform="translate(788 134)" color="#955acb"><use href="#f"/><text x="58" y="23" font-size="11" fill="#fff">CHECKPOINT 04</text><text x="58" y="41" font-size="16" fill="#fff">REFINE</text></g><g transform="translate(1008 134)" color="#79c850"><use href="#f"/><text x="58" y="23" font-size="11">CHECKPOINT 05</text><text x="58" y="41" font-size="16">SHIP</text></g></g><g class="r"><rect y="224" width="42" height="34" fill="#fff" stroke="#101820" stroke-width="5"/><rect x="5" y="207" width="34" height="20" fill="#9b1c31" stroke="#101820" stroke-width="5"/><rect x="4" y="257" width="14" height="15" fill="#101820"/><rect x="28" y="257" width="14" height="15" fill="#101820"/></g><rect y="272" width="1200" height="88" fill="#c84c0c"/><rect y="272" width="1200" height="18" fill="#79c850"/><path d="M0 308h1200M70 290v70m140-70v70m140-70v70m140-70v70m140-70v70m140-70v70m140-70v70m140-70v70" stroke="#fc9838" stroke-width="6"/><text x="600" y="338" text-anchor="middle" class="p" font-size="14" fill="#fff">INSPECT → BUILD → TEST → REFINE → SHIP → REPEAT</text></svg>
