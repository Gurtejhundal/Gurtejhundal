<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer terminal</title>
  <desc id="desc">Cyberpunk terminal showing identity, current projects, and build philosophy.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="noise" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".5" fill="#8b5cf6" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="22" fill="#030207"/>
  <rect x="18" y="18" width="1164" height="294" rx="18" fill="#070512" stroke="url(#edge)" stroke-width="1.2"/>
  <rect x="18" y="18" width="1164" height="294" rx="18" fill="url(#noise)"/>
  <rect x="18" y="18" width="1164" height="44" rx="18" fill="#0c0820"/>
  <path d="M18 62H1182" stroke="#2a2158"/>
  <circle cx="48" cy="40" r="6" fill="#ff2bd6"/><circle cx="70" cy="40" r="6" fill="#f6d365"/><circle cx="92" cy="40" r="6" fill="#39ff14"/>
  <text x="600" y="45" text-anchor="middle" fill="#7f78ab" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">gurtej@neural-shell — zsh — 120×24</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;.04;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="96" fill="#00f0ff">➜</text><text x="84" y="96" fill="#e7e5ff">whoami</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.07;.11;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="124" fill="#9cffea">Gurtejbir Singh</text><text x="245" y="124" fill="#736d98">// CSE (AI/ML) // full-stack builder // design-obsessed</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.16;.20;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="164" fill="#ff2bd6">➜</text><text x="84" y="164" fill="#e7e5ff">ls ./currently_shipping</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.23;.28;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="192" fill="#b79cff">Roadmap-Tracer/   Ghost-Engineer/   DSA_400_Days_Challenge/</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.34;.39;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="232" fill="#00f0ff">➜</text><text x="84" y="232" fill="#e7e5ff">cat ./signal</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.43;.49;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="260" fill="#39ff14">24 specialist agent skills. 8 workflows. One rule: verify before “done.”</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.57;.63;1" dur="12s" repeatCount="indefinite"/>
      <text x="54" y="292" fill="#ff2bd6">➜</text><text x="84" y="292" fill="#e7e5ff">_</text>
      <rect x="98" y="277" width="10" height="18" fill="#00f0ff" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <rect x="24" y="68" width="2" height="230" fill="#00f0ff" opacity=".6" filter="url(#glow)">
    <animate attributeName="y" values="70;290;70" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.7;0" dur="4.6s" repeatCount="indefinite"/>
  </rect>
</svg>