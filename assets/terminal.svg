<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gurtejbir retro broadcast console</title>
  <desc id="desc">Animated CRT console showing profile identity, active missions and engineering signal.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".5" stop-color="#7f3cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#02010a"/>
  <rect x="16" y="16" width="1168" height="328" rx="20" fill="#070315" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="30" y="30" width="1140" height="300" rx="14" fill="#03010c"/>
  <rect x="30" y="30" width="1140" height="300" rx="14" fill="url(#scan)" opacity=".65"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="60" fill="#00f6ff" font-size="12" letter-spacing="2">NEON SHELL // AFTER MIDNIGHT BUILD STATION</text>
    <text x="1148" y="60" text-anchor="end" fill="#ff2bd6" font-size="12" letter-spacing="2">REC ●</text>

    <g font-size="18">
      <g opacity="0">
        <text x="54" y="103" fill="#ff2bd6">C:\NEON&gt;</text><text x="156" y="103" fill="#eafcff">whoami</text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;.06;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="54" y="132" fill="#00f6ff">GURTEJBIR SINGH</text>
        <text x="238" y="132" fill="#9c8ec9">// CSE (AI/ML) // engineer // interface obsessive</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.10;.15;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="54" y="176" fill="#ff2bd6">C:\NEON&gt;</text><text x="156" y="176" fill="#eafcff">dir /missions</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.21;.26;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="54" y="205" fill="#b99cff">VibeMaxing\   Ghost-Engineer\   Roadmap-Tracer\   DSA_400_Days\</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.31;.37;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="54" y="249" fill="#ff2bd6">C:\NEON&gt;</text><text x="156" y="249" fill="#eafcff">type doctrine.txt</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.43;.49;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="54" y="278" fill="#00f6ff">BUILD IT. TEST IT. MAKE IT FEEL ALIVE. VERIFY BEFORE “DONE.”</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.62;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="54" y="313" fill="#ff2bd6">C:\NEON&gt;</text>
        <rect x="158" y="297" width="11" height="19" fill="#00f6ff" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0;1" dur=".82s" repeatCount="indefinite"/>
        </rect>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.70;.75;1" dur="12s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="30" y="36" width="1140" height="2" fill="#00f6ff" opacity=".42" filter="url(#glow)">
    <animate attributeName="y" values="36;326;36" dur="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.45;.05;0" dur="5.4s" repeatCount="indefinite"/>
  </rect>
</svg>