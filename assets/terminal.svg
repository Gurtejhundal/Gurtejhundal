<g font-family="ui-monospace, Menlo, Consolas, monospace"><text x="300" y="72" fill="#00f6ff" font-size="13" letter-spacing="3">01 // IDENTITY TRANSMISSION</text><text x="300" y="120" fill="#fff" font-size="26" font-weight="700">ENGINEERING WITH TASTE. SHIPPING WITH EVIDENCE.</text><path d="M300 142H1100" stroke="url(#neon)" stroke-width="2"/><text x="325" y="192" fill="#ff2bd6" font-size="12" letter-spacing="2">CALLSIGN</text><text x="500" y="192" fill="#fff" font-size="16">GURTEJBIR SINGH</text><text x="325" y="231" fill="#00f6ff" font-size="12" letter-spacing="2">DISCIPLINE</text><text x="500" y="231" fill="#fff" font-size="16">B.TECH CSE — AI / ML</text><text x="325" y="270" fill="#ff2bd6" font-size="12" letter-spacing="2">OPERATING ON</text><text x="500" y="270" fill="#fff" font-size="16">FULL-STACK ENGINEERING · AI SYSTEMS · PRODUCT · MOTION</text><text x="325" y="309" fill="#00f6ff" font-size="12" letter-spacing="2">CURRENT ARC</text><text x="500" y="309" fill="#fff" font-size="16">400 DAYS OF DSA · DEEPER SYSTEMS · BETTER PRODUCT EXECUTION</text><text x="325" y="348" fill="#ff2bd6" font-size="12" letter-spacing="2">RULE</text><text x="500" y="348" fill="#fff" font-size="16">INSPECT → BUILD → TEST → REFINE → SHIP</text></g>
<path d="M170 64H420L450 96 420 128H170L145 96Z" fill="#0b0619" stroke="#7b4cff" stroke-width="2"/><text x="295" y="91" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#cdb9ff">“Cut the noise.</text><text x="295" y="111" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fff">Keep the signal.”</text><rect width="1200" height="470" fill="url(#scan)" opacity=".32"/></svg>