<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc" shape-rendering="crispEdges"><title id="title">Final Level — Continue</title><desc id="desc">A bright retro platform-game castle finish screen linking to Gurtejbir Singh's portfolio and repositories.</desc><style>.p{font-family:"Courier New",monospace;font-weight:900}.flag{animation:w 1.4s steps(2,end) infinite}.pulse{animation:p 1.3s steps(2,end) infinite}@keyframes w{50%{transform:translateY(7px)}}@keyframes p{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.flag,.pulse{animation:none}}</style><rect width="1200" height="350" fill="#5c94fc"/><rect x="14" y="14" width="1172" height="322" fill="none" stroke="#101820" stroke-width="12"/><path d="M88 74h34V56h50v18h35v25H88zM830 65h36V46h52v19h38v27H830z" fill="#fff"/><g transform="translate(54 118)"><rect x="28" y="50" width="190" height="135" fill="#9a5a36" stroke="#101820" stroke-width="6"/><rect x="0" y="20" width="64" height="165" fill="#c8783e" stroke="#101820" stroke-width="6"/><rect x="182" y="20" width="64" height="165" fill="#c8783e" stroke="#101820" stroke-width="6"/><path d="M0 20V0h20v20h24V0h20v20M182 20V0h20v20h24V0h20v20" fill="#c8783e" stroke="#101820" stroke-width="6"/><rect x="99" y="116" width="50" height="69" fill="#101820"/><rect x="20" y="70" width="20" height="28" fill="#ffd166"/><rect x="202" y="70" width="20" height="28" fill="#ffd166"/></g><g transform="translate(298 92)"><rect x="0" width="8" height="182" fill="#fff"/><g class="flag"><path d="M8 8h84v52H8z" fill="#79c850" stroke="#101820" stroke-width="5"/><text x="49" y="43" text-anchor="middle" class="p" font-size="26" fill="#fff">G</text></g></g>
<g class="p" text-anchor="middle"><text x="770" y="64" font-size="16" fill="#fff" stroke="#101820" stroke-width="2" paint-order="stroke" letter-spacing="3">WORLD CLEAR!</text><text x="770" y="112" font-size="34" fill="#fff" stroke="#101820" stroke-width="2" paint-order="stroke">CONTINUE THE QUEST?</text><text x="770" y="151" font-size="15" fill="#101820">PRODUCT SYSTEMS · AI TOOLS · USEFUL INTERFACES</text><text class="pulse" x="770" y="205" font-size="20" fill="#166534">[ A ] ENTER PORTFOLIO</text><text x="770" y="246" font-size="20" fill="#174a7e">[ B ] VIEW REPOSITORIES</text><text x="770" y="284" font-size="13" fill="#101820">NO GAME OVER — ONLY THE NEXT ITERATION.</text></g><rect y="302" width="1200" height="48" fill="#c84c0c"/><rect y="302" width="1200" height="16" fill="#79c850"/><path d="M0 334h1200M90 318v32m160-32v32m160-32v32m160-32v32m160-32v32m160-32v32m160-32v32" stroke="#fc9838" stroke-width="6"/></svg>
