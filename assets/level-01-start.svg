  </g>
  <g class="pixel">
    <text x="72" y="174" font-size="57" letter-spacing="3" fill="#fff7d6" class="outline">GURTEJBIR SINGH</text>
    <rect x="72" y="196" width="656" height="8" fill="#17365d"/>
    <text x="76" y="242" font-size="24" letter-spacing="2" fill="#17365d">FULL-STACK ENGINEER // AI BUILDER</text>
    <text x="76" y="279" font-size="18" letter-spacing="1" fill="#17365d">I TURN MESSY WORKFLOWS INTO SHIPPED PRODUCTS.</text>
    <text x="76" y="316" font-size="16" letter-spacing="1" fill="#fff7d6" class="outline">INSPECT  →  BUILD  →  TEST  →  REFINE  →  SHIP</text>
    <text x="76" y="360" font-size="17" letter-spacing="2" fill="#fff7d6" class="outline start">PRESS START TO EXPLORE ↓</text>
  </g>
