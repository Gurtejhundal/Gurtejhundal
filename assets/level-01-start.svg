<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Gurtejbir Singh — Start Screen</title>
  <desc id="desc">An animated eight-bit platform game scene introducing Gurtejbir Singh, a full-stack engineer and AI builder.</desc>
  <style>
    .pixel { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; }
    .outline { paint-order: stroke; stroke: #17365d; stroke-width: 5px; stroke-linejoin: miter; }
    .cloud-a { animation: drift-a 18s steps(36) infinite; }
    .cloud-b { animation: drift-b 24s steps(48) infinite; }
    .coin { animation: coin-hop 1.4s steps(2, end) infinite; transform-box: fill-box; transform-origin: center; }
    .start { animation: blink 1.25s steps(2, end) infinite; }
    @keyframes drift-a { from { transform: translateX(-130px); } to { transform: translateX(1230px); } }
    @keyframes drift-b { from { transform: translateX(1130px); } to { transform: translateX(-340px); } }
    @keyframes coin-hop { 50% { transform: translateY(-8px); } }
    @keyframes blink { 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .cloud-a,.cloud-b,.coin,.start { animation: none; } }
  </style>
  <rect width="1200" height="500" fill="#5c94fc"/>
  <rect width="1200" height="82" fill="#4b84e8"/>
  <rect y="82" width="1200" height="6" fill="#8fc7ff"/>
