  </g>
  <g class="cloud-b" fill="#fff7e8">
    <rect y="154" width="144" height="24"/><rect x="24" y="130" width="96" height="24"/><rect x="48" y="114" width="48" height="16"/><rect x="16" y="178" width="112" height="8" fill="#d8efff"/>
  </g>
  <g opacity=".95">
    <path d="M0 390V330h40v-22h40v22h40v60z" fill="#62b948"/><path d="M0 390V356h40v-20h40v20h40v34z" fill="#347c48"/>
