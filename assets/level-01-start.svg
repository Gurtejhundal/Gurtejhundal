    <text x="474" y="38">COINS</text><text x="515" y="68">× 24</text>
    <text x="790" y="38">WORLD</text><text x="822" y="68">1-1</text>
    <text x="1050" y="38">STATUS</text><text x="1062" y="68">OPEN</text>
  </g>
  <g class="cloud-a" fill="#fff7e8">
