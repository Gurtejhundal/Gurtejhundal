<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Prime missions</title>
<desc id="d">Four cyberpunk project transmissions: VibeMaxing, Ghost Engineer, Roadmap Tracer and DSA 400.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".45" stop-color="#08041a"/>
      <stop offset="1" stop-color="#120326"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".5" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".22"/>
    </pattern>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b1640" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
<rect width="1200" height="650" fill="url(#bg)"/>
<rect width="1200" height="650" fill="url(#microgrid)" opacity=".62"/>
<path d="M30 22H1170V628H30Z" fill="#050411" stroke="#2b1652" stroke-width="2"/>
<path d="M30 22H460M740 22H1170" stroke="url(#neon)" stroke-width="3"/>
<g font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="68" y="66" fill="#00f6ff" font-size="13" letter-spacing="3">02 // PRIME MISSIONS</text>
  <text x="1132" y="66" text-anchor="end" fill="#ff2bd6" font-size="11" letter-spacing="2">ARCHIVE NODE // CLICK PANEL TO OPEN REPOSITORIES ↗</text>
  <text x="68" y="108" fill="#f7f2ff" font-size="23" font-weight="700">FOUR SYSTEMS. ONE RULE: BUILD THE THING FOR REAL.</text>

  <path d="M56 142H570V355H82L56 329Z" fill="#070316" stroke="#2f1e63" stroke-width="2"/>
  <path d="M56 142H312" stroke="#00f6ff" stroke-width="4" filter="url(#glow)"/>
  <text x="84" y="181" fill="#00f6ff" font-size="11" letter-spacing="2">02.A // AGENT SYSTEM</text>
  <text x="84" y="218" fill="#f7f2ff" font-size="22" font-weight="700">VIBEMAXING</text>
  <text x="84" y="246" fill="#b1a5d1" font-size="12">Website execution layer for serious frontend work.</text>
  <text x="84" y="280" fill="#e8ffff" font-size="12">24 specialist skills // 8 workflows</text>
  <text x="84" y="305" fill="#8f83bd" font-size="11">responsive reconstruction // motion // QA</text>
  <text x="84" y="331" fill="#00f6ff" font-size="11">github.com/Gurtejhundal/VibeMaxing</text>
  <circle cx="536" cy="177" r="4" fill="#00f6ff"><animate attributeName="opacity" values="1;.15;1" dur=".9s" repeatCount="indefinite"/></circle>

  <path d="M602 142H1144V329L1118 355H602Z" fill="#070316" stroke="#4a1f71" stroke-width="2"/>
  <path d="M886 142H1144" stroke="#ff2bd6" stroke-width="4" filter="url(#glow)"/>
  <text x="632" y="181" fill="#ff2bd6" font-size="11" letter-spacing="2">02.B // REVIEW COUNCIL</text>
  <text x="632" y="218" fill="#f7f2ff" font-size="22" font-weight="700">GHOST ENGINEER</text>
  <text x="632" y="246" fill="#b1a5d1" font-size="12">Multi-agent repository analysis without code theatre.</text>
  <text x="632" y="280" fill="#e8ffff" font-size="12">Architect // Debugger // Security // Product</text>
  <text x="632" y="305" fill="#8f83bd" font-size="11">evidence // disagreement // prioritized risk</text>
  <text x="632" y="331" fill="#ff2bd6" font-size="11">github.com/Gurtejhundal/Ghost-Engineer</text>
  <circle cx="1110" cy="177" r="4" fill="#ff2bd6"><animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/></circle>

  <path d="M56 382H570V596H56V408L82 382Z" fill="#070316" stroke="#36206f" stroke-width="2"/>
  <path d="M56 596H320" stroke="#9f6cff" stroke-width="4" filter="url(#glow)"/>
  <text x="84" y="421" fill="#9f6cff" font-size="11" letter-spacing="2">02.C // EXECUTION ENGINE</text>
  <text x="84" y="458" fill="#f7f2ff" font-size="22" font-weight="700">ROADMAP TRACER</text>
  <text x="84" y="486" fill="#b1a5d1" font-size="12">Turns giant learning roadmaps into trackable systems.</text>
  <text x="84" y="520" fill="#e8ffff" font-size="12">React // Vite // FastAPI // SQLAlchemy</text>
  <text x="84" y="545" fill="#8f83bd" font-size="11">import // extract // track // edit // export</text>
  <text x="84" y="571" fill="#9f6cff" font-size="11">github.com/Gurtejhundal/Roadmap-Tracer</text>

  <path d="M602 382H1118L1144 408V596H602Z" fill="#070316" stroke="#57204d" stroke-width="2"/>
  <path d="M886 596H1144" stroke="#ffd166" stroke-width="4" filter="url(#glow)"/>
  <text x="632" y="421" fill="#ffd166" font-size="11" letter-spacing="2">02.D // THE LONG GAME</text>
  <text x="632" y="458" fill="#f7f2ff" font-size="22" font-weight="700">DSA 400</text>
  <text x="632" y="486" fill="#b1a5d1" font-size="12">Consistency over hype. Pattern recognition over memorizing.</text>
  <text x="632" y="520" fill="#e8ffff" font-size="12">Python // algorithms // trade-offs // journaling</text>
  <text x="632" y="545" fill="#8f83bd" font-size="11">derive solutions // understand complexity // repeat</text>
  <text x="632" y="571" fill="#ffd166" font-size="11">github.com/Gurtejhundal/DSA_400_Days_Challenge</text>
</g>
<rect x="0" y="12" width="1200" height="2" fill="#00f6ff" opacity=".2">
 <animate attributeName="y" values="12;638;12" dur="7s" repeatCount="indefinite"/>
</rect>
<rect width="1200" height="650" fill="url(#scan)" opacity=".34"/>
</svg>