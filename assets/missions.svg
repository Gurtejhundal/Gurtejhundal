<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Prime missions</title><desc id="d">Beast Boy narrates four featured engineering projects from the right edge.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05000d"/><stop offset=".5" stop-color="#120229"/><stop offset="1" stop-color="#26053c"/></linearGradient><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f6ff"/><stop offset=".5" stop-color="#9250ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff36f"/><stop offset=".38" stop-color="#ffad5d"/><stop offset=".74" stop-color="#ff4f91"/><stop offset="1" stop-color="#ff20ce"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".16"/></pattern></defs><rect width="1200" height="700" fill="url(#bg)"/><path d="M28 24H1172V676H28Z" fill="#060311" stroke="#321c55" stroke-width="2"/><g font-family="ui-monospace, Menlo, Consolas, monospace"><text x="68" y="68" fill="#ff2bd6" font-size="13" letter-spacing="3">02 // PRIME MISSIONS</text><text x="68" y="111" fill="#fff" font-size="25" font-weight="700">FOUR SYSTEMS THAT EXPLAIN HOW I THINK.</text><path d="M68 132H1020" stroke="url(#neon)" stroke-width="2"/><g transform="translate(66 164)"><path d="M0 0H470V205H0Z" fill="#0a0619" stroke="#244e63" stroke-width="2"/><path d="M0 0H215" stroke="#00f6ff" stroke-width="4"/><text x="28" y="40" fill="#00f6ff" font-size="11" letter-spacing="2">AGENT EXECUTION SYSTEM</text><text x="28" y="78" fill="#fff" font-size="24" font-weight="700">VIBEMAXING</text><text x="28" y="112" fill="#bdb0d6" font-size="13">24 specialist skills · 8 workflows</text><text x="28" y="142" fill="#e9faff" font-size="13">responsive reconstruction · motion · QA · verification</text><text x="28" y="178" fill="#00f6ff" font-size="12">github.com/Gurtejhundal/VibeMaxing</text></g><g transform="translate(560 164)"><path d="M0 0H470V205H0Z" fill="#0a0619" stroke="#663164" stroke-width="2"/><path d="M255 0H470" stroke="#ff2bd6" stroke-width="4"/><text x="28" y="40" fill="#ff2bd6" font-size="11" letter-spacing="2">MULTI-AGENT REVIEW</text><text x="28" y="78" fill="#fff" font-size="24" font-weight="700">GHOST ENGINEER</text><text x="28" y="112" fill="#bdb0d6" font-size="13">Architect · Debugger · Security · Product</text><text x="28" y="142" fill="#e9faff" font-size="13">repository context · disagreement · prioritized engineering risk</text><text x="28" y="178" fill="#ff2bd6" font-size="12">github.com/Gurtejhundal/Ghost-Engineer</text></g><g transform="translate(66 398)"><path d="M0 0H470V205H0Z" fill="#0a0619" stroke="#4b3475" stroke-width="2"/><path d="M0 205H215" stroke="#9969ff" stroke-width="4"/><text x="28" y="40" fill="#9969ff" font-size="11" letter-spacing="2">LEARNING EXECUTION ENGINE</text><text x="28" y="78" fill="#fff" font-size="24" font-weight="700">ROADMAP TRACER</text><text x="28" y="112" fill="#bdb0d6" font-size="13">React · Vite · FastAPI · SQLAlchemy · Pydantic</text><text x="28" y="142" fill="#e9faff" font-size="13">import · extract · track · edit · search · export</text><text x="28" y="178" fill="#9969ff" font-size="12">github.com/Gurtejhundal/Roadmap-Tracer</text></g><g transform="translate(560 398)"><path d="M0 0H470V205H0Z" fill="#0a0619" stroke="#725329" stroke-width="2"/><path d="M255 205H470" stroke="#ffd166" stroke-width="4"/><text x="28" y="40" fill="#ffd166" font-size="11" letter-spacing="2">THE LONG GAME</text><text x="28" y="78" fill="#fff" font-size="24" font-weight="700">DSA 400</text><text x="28" y="112" fill="#bdb0d6" font-size="13">Python · algorithms · patterns · trade-offs</text><text x="28" y="142" fill="#e9faff" font-size="13">consistency over hype · pattern recognition over memorization</text><text x="28" y="178" fill="#ffd166" font-size="12">github.com/Gurtejhundal/DSA_400_Days_Challenge</text></g></g><g transform="translate(1025 390) scale(0.92)"><path d="M50 56 Q78 14 118 39 L132 84 117 119 73 118 47 94Z" fill="#73cf6a" stroke="#163119" stroke-width="4"/><path d="M48 50 L34 11 61 26 71 -8 89 20 119 -2 110 34 137 27 120 56Z" fill="#0d2b1d"/><circle cx="79" cy="69" r="7" fill="#fff"/><circle cx="107" cy="69" r="7" fill="#fff"/><path d="M80 94 Q95 104 111 91" fill="none" stroke="#15351e" stroke-width="5"/><path d="M60 113 L119 113 131 189 54 189Z" fill="#2b173f" stroke="#101018" stroke-width="5"/><path d="M73 127 L111 127 116 175 67 175Z" fill="#6f3b9e"/><path d="M61 145 L28 188M121 145 L151 185" stroke="#73cf6a" stroke-width="14" stroke-linecap="round"/><path d="M72 189 L61 244M108 189 L121 244" stroke="#15131c" stroke-width="16" stroke-linecap="round"/></g><path d="M895 252H1160V334H895L864 293Z" fill="#0a0619" stroke="#67d866" stroke-width="2"/><text x="1022" y="282" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fff">“Ideas are cheap.</text><text x="1022" y="305" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#74e56f">Show me what actually shipped.”</text><rect width="1200" height="700" fill="url(#scan)" opacity=".31"/></svg>