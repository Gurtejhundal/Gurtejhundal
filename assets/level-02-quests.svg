    <g class="pixel"><text x="120" y="54" font-size="14" fill="#5c94fc" letter-spacing="2">QUEST 01 // LOCAL-FIRST</text><text x="120" y="87" font-size="27" fill="#fff7d6">MEDIAFORGE</text><text x="28" y="132" font-size="15" fill="#b9d9f4">MEDIA, IMAGE, PDF + DOCUMENT TOOLS</text><text x="28" y="160" font-size="14" fill="#79c850">NEXT.JS · TYPESCRIPT · BROWSER PROCESSING</text><text x="28" y="187" font-size="13" fill="#ffd166">POWER-UP: PRIVACY-FIRST WORKFLOWS</text></g>
  </g>
  <g transform="translate(616 138)">
