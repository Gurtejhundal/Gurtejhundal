    <g class="block block-b" transform="translate(28 34)"><rect width="68" height="68" fill="#166534"/><rect x="8" y="8" width="52" height="52" fill="#79c850"/><path d="M20 18h28v8H20zm0 14h28v8H20zm0 14h18v8H20z" fill="#fff7d6"/></g>
    <g class="pixel"><text x="120" y="54" font-size="14" fill="#79c850" letter-spacing="2">QUEST 02 // LEARNING ENGINE</text><text x="120" y="87" font-size="27" fill="#fff7d6">ROADMAP TRACER</text><text x="28" y="132" font-size="15" fill="#b9d9f4">IMPORT → TRACK → EDIT → EXPORT</text><text x="28" y="160" font-size="14" fill="#79c850">REACT · FASTAPI · SQLALCHEMY</text><text x="28" y="187" font-size="13" fill="#ffd166">POWER-UP: LONG-RANGE CONSISTENCY</text></g>
