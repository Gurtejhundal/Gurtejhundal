    <rect width="532" height="202" fill="#071725" stroke="#b48cff" stroke-width="5"/><rect width="532" height="12" fill="#b48cff"/>
    <g class="block block-c" transform="translate(28 34)"><rect width="68" height="68" fill="#3b245c"/><rect x="8" y="8" width="52" height="52" fill="#7b4fa8"/><rect x="18" y="20" width="10" height="10" fill="#fff7d6"/><rect x="40" y="20" width="10" height="10" fill="#fff7d6"/><path d="M18 44h32v8H18z" fill="#1a1528"/></g>
    <g class="pixel"><text x="120" y="54" font-size="14" fill="#b48cff" letter-spacing="2">QUEST 03 // MULTI-AGENT REVIEW</text><text x="120" y="87" font-size="27" fill="#fff7d6">GHOST ENGINEER</text><text x="28" y="132" font-size="15" fill="#b9d9f4">ARCHITECT · DEBUGGER · SECURITY · PRODUCT</text><text x="28" y="160" font-size="14" fill="#b48cff">REPOSITORY CONTEXT · PRIORITIZED RISK</text><text x="28" y="187" font-size="13" fill="#ffd166">POWER-UP: STRUCTURED DISAGREEMENT</text></g>
