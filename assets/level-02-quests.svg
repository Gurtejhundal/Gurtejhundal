<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Level Two — Selected Quests</title>
  <desc id="desc">Four pixel-art project cards for MediaForge, Roadmap Tracer, Ghost Engineer, and VibeMaxing.</desc>
  <style>
    .pixel { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; }
    .block { animation: bob 1.8s steps(2,end) infinite; transform-box: fill-box; transform-origin: center; }
    .block-b { animation-delay: .5s; }.block-c { animation-delay: .9s; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .block { animation: none; } }
  </style>
  <rect width="1200" height="650" fill="#0d2238"/><rect x="18" y="18" width="1164" height="614" fill="#102b46" stroke="#ffd166" stroke-width="6"/>
  <g fill="#183e61"><rect x="30" y="108" width="1140" height="8"/><rect x="30" y="600" width="1140" height="8"/></g>
