<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Gurtejbir Singh — Mission Control</title>
<desc id="desc">Heavily animated aerospace mission-control profile header with live telemetry, orbital systems, scanning sweeps, data traces, signal traffic and status indicators.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080a0c"/>
    <stop offset=".55" stop-color="#0d1114"/>
    <stop offset="1" stop-color="#13191d"/>
  </linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3eee4"/>
    <stop offset="1" stop-color="#8f9aa1"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff6b35" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ff6b35" stop-opacity=".17"/>
    <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="scanV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3eee4" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f3eee4" stop-opacity=".07"/>
    <stop offset="1" stop-color="#f3eee4" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="coreGlow">
    <stop offset="0" stop-color="#ff6b35" stop-opacity=".45"/>
    <stop offset=".45" stop-color="#ff6b35" stop-opacity=".11"/>
    <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#263039" stroke-width="1" opacity=".55"/>
  </pattern>
  <pattern id="microGrid" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M8 0H0V8" fill="none" stroke="#71808a" stroke-width=".45" opacity=".13"/>
  </pattern>
  <filter id="orangeGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <clipPath id="panelClip"><rect x="54" y="206" width="470" height="112" rx="10"/></clipPath>
</defs>

<!-- base -->
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="384" rx="14" fill="none" stroke="#2a343b"/>
<rect x="18" y="18" width="1164" height="384" rx="14" fill="url(#grid)" opacity=".48">
  <animateTransform attributeName="transform" type="translate" values="0 0;32 32" dur="8s" repeatCount="indefinite"/>
</rect>
<rect x="18" y="18" width="1164" height="384" rx="14" fill="url(#microGrid)" opacity=".22">
  <animateTransform attributeName="transform" type="translate" values="0 0;-8 8" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- moving sweep -->
<rect x="-340" y="18" width="300" height="384" fill="url(#sweep)" opacity=".7">
  <animate attributeName="x" values="-340;1240" dur="6.8s" repeatCount="indefinite"/>
</rect>
<rect x="18" y="-90" width="1164" height="90" fill="url(#scanV)" opacity=".65">
  <animate attributeName="y" values="-90;420" dur="4.6s" repeatCount="indefinite"/>
</rect>

<!-- animated frame corners -->
<g fill="none" stroke="#ff6b35" stroke-width="2" opacity=".9">
  <path d="M18 62V32Q18 18 32 18H82" stroke-dasharray="72" stroke-dashoffset="72">
    <animate attributeName="stroke-dashoffset" values="72;0;0;72" keyTimes="0;.22;.82;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M1182 62V32Q1182 18 1168 18H1118" stroke-dasharray="72" stroke-dashoffset="72">
    <animate attributeName="stroke-dashoffset" values="72;0;0;72" keyTimes="0;.22;.82;1" dur="4s" begin=".6s" repeatCount="indefinite"/>
  </path>
  <path d="M18 358V388Q18 402 32 402H82" stroke-dasharray="72" stroke-dashoffset="72">
    <animate attributeName="stroke-dashoffset" values="72;0;0;72" keyTimes="0;.22;.82;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M1182 358V388Q1182 402 1168 402H1118" stroke-dasharray="72" stroke-dashoffset="72">
    <animate attributeName="stroke-dashoffset" values="72;0;0;72" keyTimes="0;.22;.82;1" dur="4s" begin="1.8s" repeatCount="indefinite"/>
  </path>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <!-- eyebrow signal -->
  <g>
    <circle cx="54" cy="58" r="3" fill="#ff6b35" filter="url(#orangeGlow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="1.25s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="62" font-size="13" letter-spacing="2" fill="#ff6b35">GTRJ // FLIGHT SYSTEMS</text>
    <rect x="256" y="51" width="8" height="14" fill="#ff6b35">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="54" y="116" font-size="48" font-weight="700" letter-spacing="1.5" fill="#f3eee4">GURTEJBIR SINGH</text>
  <text x="56" y="150" font-size="15" letter-spacing="3" fill="#a7b0b6">FULL-STACK ENGINEERING / PRODUCT SYSTEMS / DEVELOPER TOOLS</text>

  <!-- little moving data line under title -->
  <g transform="translate(56 168)" fill="none" stroke-linecap="round">
    <path d="M0 0H438" stroke="#263039" stroke-width="2"/>
    <path d="M0 0H84" stroke="#ff6b35" stroke-width="2" stroke-dasharray="18 8">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cy="0" r="3" fill="#f3eee4" stroke="none">
      <animate attributeName="cx" values="0;438" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- mission brief -->
  <g transform="translate(54 206)">
    <rect width="470" height="112" rx="10" fill="#0f1316" stroke="#303b42"/>
    <rect width="470" height="112" rx="10" fill="none" stroke="#ff6b35" opacity=".13">
      <animate attributeName="opacity" values=".08;.26;.08" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="28" font-size="11" letter-spacing="1.5" fill="#68767f">MISSION BRIEF</text>
    <text x="20" y="58" font-size="17" fill="#f3eee4">Build systems that turn messy workflows</text>
    <text x="20" y="82" font-size="17" fill="#f3eee4">into useful, reliable products.</text>
    <rect x="20" y="94" width="108" height="3" fill="#ff6b35">
      <animate attributeName="width" values="28;108;64;108" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#panelClip)" opacity=".3">
      <rect x="-160" y="0" width="90" height="112" fill="url(#sweep)">
        <animate attributeName="x" values="-160;560" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- status rail -->
  <text x="54" y="365" font-size="11" letter-spacing="2" fill="#68767f">STATUS</text>
  <circle cx="121" cy="361" r="5" fill="#8bd450"/>
  <circle cx="121" cy="361" r="5" fill="none" stroke="#8bd450" stroke-width="1.5">
    <animate attributeName="r" values="5;14" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="135" y="365" font-size="12" fill="#d8ddd9">ACTIVE</text>
  <text x="228" y="365" font-size="11" letter-spacing="2" fill="#68767f">MODE</text>
  <text x="278" y="365" font-size="12" fill="#d8ddd9">BUILD</text>
  <g fill="#ff6b35" font-size="13" font-weight="700">
    <text x="320" y="365">→<animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin="0s" repeatCount="indefinite"/></text>
    <text x="333" y="365">→<animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".2s" repeatCount="indefinite"/></text>
    <text x="346" y="365">→<animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".4s" repeatCount="indefinite"/></text>
  </g>
  <text x="367" y="365" font-size="12" fill="#d8ddd9">TEST → SHIP</text>
</g>

<!-- orbital system -->
<g transform="translate(790 205)">
  <circle r="132" fill="url(#coreGlow)" opacity=".22">
    <animate attributeName="r" values="116;146;116" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.28;.12" dur="4.4s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating rings -->
  <g>
    <circle r="98" fill="none" stroke="#36434b" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle r="98" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="34 582" stroke-linecap="round" filter="url(#orangeGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
  </g>
  <g>
    <ellipse rx="172" ry="66" fill="none" stroke="#46545d" stroke-width="1.2" stroke-dasharray="8 6" transform="rotate(-18)"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
  </g>
  <g>
    <ellipse rx="144" ry="116" fill="none" stroke="#273139" stroke-width="1" stroke-dasharray="3 7" transform="rotate(28)"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
  </g>

  <!-- target ticks -->
  <g stroke="#68767f" stroke-width="1.3" opacity=".8">
    <path d="M0-118V-104M0 104V118M-118 0H-104M104 0H118"/>
    <path d="M-83-83l10 10M73 73l10 10M83-83l-10 10M-73 73l-10 10"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
  </g>

  <!-- core -->
  <circle r="44" fill="url(#orb)" opacity=".96"/>
  <circle r="34" fill="#1c2328"/>
  <circle r="29" fill="none" stroke="#ff6b35" stroke-width="1" opacity=".35">
    <animate attributeName="r" values="27;31;27" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g>
    <path d="M-17 -4L0 -21 17 -4 10 19H-10Z" fill="none" stroke="#ff6b35" stroke-width="3" filter="url(#orangeGlow)"/>
    <path d="M0 -21V19M-12 2H12" stroke="#f3eee4" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" values="0;4;-4;0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- satellite rotating around core -->
  <g>
    <g transform="translate(132 -40) rotate(12)">
      <rect x="-16" y="-10" width="32" height="20" rx="3" fill="#f3eee4"/>
      <rect x="-48" y="-14" width="28" height="28" fill="none" stroke="#ff6b35" stroke-width="2"/>
      <rect x="20" y="-14" width="28" height="28" fill="none" stroke="#ff6b35" stroke-width="2"/>
      <path d="M-20 0H20" stroke="#f3eee4" stroke-width="2"/>
      <circle r="3" fill="#ff6b35" filter="url(#orangeGlow)">
        <animate attributeName="opacity" values=".25;1;.25" dur=".9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8.5s" repeatCount="indefinite"/>
  </g>

  <!-- fast orbiting beacon -->
  <g>
    <circle cx="0" cy="-98" r="4" fill="#ff6b35" filter="url(#orangeGlow)"/>
    <circle cx="0" cy="-98" r="9" fill="none" stroke="#ff6b35" opacity=".35"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.3s" repeatCount="indefinite"/>
  </g>

  <!-- radar sweep -->
  <path d="M0 0L0-92A92 92 0 0 1 37-84Z" fill="#ff6b35" opacity=".08">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- data packets from brief to orbital core -->
<path id="packetPath" d="M526 262 C610 262 648 235 692 220 S742 205 760 205" fill="none" stroke="#263039" stroke-width="1" stroke-dasharray="4 7"/>
<g fill="#ff6b35" filter="url(#orangeGlow)">
  <circle r="3"><animateMotion dur="2.7s" repeatCount="indefinite"><mpath href="#packetPath"/></animateMotion></circle>
  <circle r="2.4"><animateMotion dur="2.7s" begin=".9s" repeatCount="indefinite"><mpath href="#packetPath"/></animateMotion></circle>
  <circle r="2"><animateMotion dur="2.7s" begin="1.8s" repeatCount="indefinite"><mpath href="#packetPath"/></animateMotion></circle>
</g>

<!-- top and bottom bus signals -->
<g stroke="#ff6b35" stroke-width="2" fill="none">
  <path d="M652 60h90" stroke-dasharray="12 7">
    <animate attributeName="stroke-dashoffset" values="0;-38" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M742 60l10 10M742 60l10-10"/>
  <path d="M652 338h62" stroke-dasharray="10 6">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="1.1s" repeatCount="indefinite"/>
  </path>
</g>

<!-- telemetry panel -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <text x="1002" y="68" fill="#68767f" letter-spacing="1.5">TELEMETRY // LIVE</text>
  <circle cx="1128" cy="64" r="3" fill="#8bd450">
    <animate attributeName="opacity" values=".25;1;.25" dur="1s" repeatCount="indefinite"/>
  </circle>

  <g fill="#d8ddd9">
    <text x="1002" y="96">SYS.01</text><text x="1080" y="96" fill="#8bd450">ONLINE</text>
    <text x="1002" y="120">SYS.02</text><text x="1080" y="120">BUILDING</text>
    <text x="1002" y="144">SYS.03</text><text x="1080" y="144">LEARNING</text>
  </g>

  <!-- tiny equalizer -->
  <g transform="translate(1002 158)" fill="#68767f">
    <rect x="0" y="10" width="5" height="10"><animate attributeName="height" values="10;23;7;17;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;-3;13;3;10" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="10" y="4" width="5" height="16"><animate attributeName="height" values="16;7;25;12;16" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="4;13;-5;8;4" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="20" y="8" width="5" height="12"><animate attributeName="height" values="12;24;9;19;12" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="8;-4;11;1;8" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect x="30" y="1" width="5" height="19"><animate attributeName="height" values="19;8;22;5;19" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="1;12;-2;15;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="40" y="11" width="5" height="9"><animate attributeName="height" values="9;21;6;18;9" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="11;-1;14;2;11" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- signal bar -->
  <rect x="1002" y="195" width="128" height="5" rx="2.5" fill="#273139"/>
  <rect x="1002" y="195" width="101" height="5" rx="2.5" fill="#ff6b35" filter="url(#orangeGlow)">
    <animate attributeName="width" values="71;101;88;113;95;101" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <text x="1002" y="221" fill="#68767f">SIGNAL</text>
  <text x="1070" y="221" fill="#f3eee4">78—92%</text>

  <!-- waveform -->
  <path d="M1002 250 L1015 250 1023 237 1032 265 1041 245 1050 250 1060 250 1068 232 1078 268 1088 243 1096 250 1112 250 1120 240 1130 250" fill="none" stroke="#ff6b35" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="180" stroke-dashoffset="180" filter="url(#orangeGlow)">
    <animate attributeName="stroke-dashoffset" values="180;0" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <line x1="1002" y1="274" x2="1130" y2="274" stroke="#263039"/>
  <circle cy="274" r="2.5" fill="#f3eee4">
    <animate attributeName="cx" values="1002;1130" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- scrolling telemetry values -->
  <g fill="#68767f">
    <text x="1002" y="304">LATENCY</text><text x="1082" y="304" fill="#d8ddd9">12ms</text>
    <text x="1002" y="324">PACKETS</text><text x="1082" y="324" fill="#d8ddd9">0048</text>
    <text x="1002" y="344">UPLINK</text><text x="1082" y="344" fill="#8bd450">LOCKED</text>
  </g>
  <rect x="1129" y="294" width="2" height="10" fill="#ff6b35"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
</g>

<!-- bottom ticker -->
<g transform="translate(650 381)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="1" fill="#68767f">
  <text x="0" y="0">UPLINK::GTRJ</text>
  <text x="94" y="0" fill="#ff6b35">●</text>
  <text x="108" y="0">FULL-STACK / SYSTEMS / SHIP</text>
  <text x="318" y="0" fill="#ff6b35">●</text>
  <text x="332" y="0">CHANNEL 07</text>
  <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;8 0;0 0" dur="6s" repeatCount="indefinite"/>
</g>

<!-- subtle random-looking indicator flashes -->
<g fill="#ff6b35">
  <circle cx="584" cy="92" r="2"><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.06;.12;1" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="622" cy="292" r="1.6"><animate attributeName="opacity" values="0;0;.8;0;0" keyTimes="0;.42;.48;.54;1" dur="4.3s" repeatCount="indefinite"/></circle>
  <circle cx="947" cy="108" r="1.8"><animate attributeName="opacity" values="0;.8;0;0" keyTimes="0;.1;.16;1" dur="5.2s" repeatCount="indefinite"/></circle>
</g>
</svg>