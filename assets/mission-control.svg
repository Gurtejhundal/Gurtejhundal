<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Gurtejbir Singh — Mission Control</title>
<desc id="desc">Aerospace mission-control inspired profile header for a full-stack engineer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090b0d"/>
    <stop offset="1" stop-color="#12171b"/>
  </linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3eee4"/>
    <stop offset="1" stop-color="#9aa6ad"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#263039" stroke-width="1" opacity=".55"/>
  </pattern>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="384" rx="14" fill="none" stroke="#2a343b"/>
<rect x="18" y="18" width="1164" height="384" rx="14" fill="url(#grid)" opacity=".48"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="54" y="62" font-size="13" letter-spacing="2" fill="#ff6b35">GTRJ // FLIGHT SYSTEMS</text>
  <text x="54" y="116" font-size="48" font-weight="700" letter-spacing="1.5" fill="#f3eee4">GURTEJBIR SINGH</text>
  <text x="56" y="150" font-size="15" letter-spacing="3" fill="#a7b0b6">FULL-STACK ENGINEERING / PRODUCT SYSTEMS / DEVELOPER TOOLS</text>

  <g transform="translate(54 206)">
    <rect width="470" height="112" rx="10" fill="#0f1316" stroke="#303b42"/>
    <text x="20" y="28" font-size="11" letter-spacing="1.5" fill="#68767f">MISSION BRIEF</text>
    <text x="20" y="58" font-size="17" fill="#f3eee4">Build systems that turn messy workflows</text>
    <text x="20" y="82" font-size="17" fill="#f3eee4">into useful, reliable products.</text>
    <rect x="20" y="94" width="108" height="3" fill="#ff6b35"/>
  </g>

  <text x="54" y="365" font-size="11" letter-spacing="2" fill="#68767f">STATUS</text>
  <circle cx="121" cy="361" r="5" fill="#8bd450"/>
  <text x="135" y="365" font-size="12" fill="#d8ddd9">ACTIVE</text>
  <text x="228" y="365" font-size="11" letter-spacing="2" fill="#68767f">MODE</text>
  <text x="278" y="365" font-size="12" fill="#d8ddd9">BUILD → TEST → SHIP</text>
</g>

<!-- orbital system -->
<g transform="translate(790 205)">
  <circle r="98" fill="none" stroke="#36434b" stroke-width="1.5"/>
  <ellipse rx="172" ry="66" fill="none" stroke="#46545d" stroke-width="1.2" transform="rotate(-18)"/>
  <ellipse rx="144" ry="116" fill="none" stroke="#273139" stroke-width="1" transform="rotate(28)"/>
  <circle r="44" fill="url(#orb)" opacity=".96"/>
  <circle r="34" fill="#1c2328"/>
  <path d="M-17 -4L0 -21 17 -4 10 19H-10Z" fill="none" stroke="#ff6b35" stroke-width="3"/>
  <path d="M0 -21V19M-12 2H12" stroke="#f3eee4" stroke-width="2"/>
  <g transform="translate(132 -40) rotate(12)">
    <rect x="-16" y="-10" width="32" height="20" rx="3" fill="#f3eee4"/>
    <rect x="-48" y="-14" width="28" height="28" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <rect x="20" y="-14" width="28" height="28" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <path d="M-20 0H20" stroke="#f3eee4" stroke-width="2"/>
  </g>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <text x="1010" y="78" fill="#68767f">TELEMETRY</text>
  <text x="1010" y="104" fill="#d8ddd9">SYS.01  ONLINE</text>
  <text x="1010" y="128" fill="#d8ddd9">SYS.02  BUILDING</text>
  <text x="1010" y="152" fill="#d8ddd9">SYS.03  LEARNING</text>
  <rect x="1010" y="178" width="120" height="4" rx="2" fill="#273139"/>
  <rect x="1010" y="178" width="94" height="4" rx="2" fill="#ff6b35"/>
  <text x="1010" y="204" fill="#68767f">SIGNAL 78%</text>
</g>

<g stroke="#ff6b35" stroke-width="2">
  <path d="M652 60h90"/>
  <path d="M742 60l10 10"/>
  <path d="M742 60l10-10"/>
  <path d="M652 338h62"/>
</g>
</svg>