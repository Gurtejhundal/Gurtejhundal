 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#253038" opacity=".38"/></pattern>
 <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect x="16" y="16" width="1168" height="528" rx="13" fill="url(#grid)" stroke="#2b373e"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
 <text x="48" y="56" font-size="12" letter-spacing="2" fill="#ff6b35">02 // FEATURED SYSTEMS</text>
 <text x="48" y="87" font-size="22" font-weight="700" fill="#f3eee4">ACTIVE MISSION MODULES</text>
