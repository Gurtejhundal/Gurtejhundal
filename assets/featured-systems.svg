<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Featured Systems</title><desc id="d">Animated mission-control cards for featured engineering projects.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#090c0e"/><stop offset="1" stop-color="#11171a"/></linearGradient>
