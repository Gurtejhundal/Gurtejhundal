<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Open channel</title>
<desc id="d">Final retro cyberpunk call to action with neon city horizon and perspective grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".45" stop-color="#08041a"/>
      <stop offset="1" stop-color="#120326"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".5" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".22"/>
    </pattern>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b1640" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
<rect width="1200" height="390" fill="url(#bg)"/>
<rect width="1200" height="390" fill="url(#microgrid)" opacity=".55"/>
<path d="M0 278L86 278V233H116V278H192V246H222V278H310V215H348V278H446V238H478V278H575V226H610V278H718V247H750V278H842V207H878V278H986V232H1020V278H1114V245H1148V278H1200V390H0Z" fill="#020208" stroke="#52218a"/>
<path d="M0 278H1200" stroke="#00f6ff" stroke-width="3" filter="url(#glow)">
 <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
</path>
<g stroke-linecap="round" opacity=".65">
  <path d="M600 278L-40 390M600 278L205 390M600 278L420 390M600 278L780 390M600 278L995 390M600 278L1240 390" stroke="url(#neon)"/>
  <path d="M0 304H1200M0 332H1200M0 362H1200" stroke="#6730ad"/>
</g>
<g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">
  <text x="600" y="65" fill="#ff2bd6" font-size="13" letter-spacing="4">06 // OPEN CHANNEL</text>
  <text x="600" y="116" fill="#f7f2ff" font-size="28" font-weight="700">BUILDING SOMETHING DIFFICULT, STRANGE OR USEFUL?</text>
  <text x="600" y="153" fill="#a99dcc" font-size="14" letter-spacing="2">THE CITY IS DARK. THE BUILD IS NOT.</text>
  <text x="600" y="207" fill="#00f6ff" font-size="15" letter-spacing="3">CLICK TO ENTER THE PORTFOLIO // gurtejbirsingh.vercel.app</text>
  <text x="600" y="247" fill="#ff2bd6" font-size="12" letter-spacing="4">NIGHT BEGINS TO SHINE // SIGNAL NEVER SLEEPS</text>
</g>
<g fill="#00f6ff" opacity=".55">
 <rect x="101" y="247" width="5" height="16"/><rect x="329" y="226" width="5" height="17"/><rect x="856" y="218" width="5" height="17"/><rect x="1128" y="256" width="5" height="15"/>
</g>
<rect width="1200" height="390" fill="url(#scan)" opacity=".35"/>
<g opacity="0">
 <rect x="160" y="97" width="880" height="7" fill="#ff2bd6"/>
 <animate attributeName="opacity" values="0;0;.45;0;0" keyTimes="0;.72;.74;.76;1" dur="5s" repeatCount="indefinite"/>
</g>
</svg>